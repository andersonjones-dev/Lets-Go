<!doctype html>
<html lang="en-IN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="description" content="Plan group trips with friends: vote on plans, share routes, split every expense and settle up by UPI.">
<meta name="theme-color" content="#FAF7F0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Let's Go">
<meta name="application-name" content="Let's Go">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style id="cssClassic">
/* Layout: one phone-width column (max 480px), sticky screen header, scrolling body, fixed five-tab bar.
   Classic design. Colours: Original (evergreen), Masala, Monsoon, each light or dark (html.m-dark). */
:root{
  --ever:#064E43; --ever-2:#0B6B5C; --on-ever:#FFFFFF; --teal:#103D38;
  --ivory:#FAF7F0; --cream:#F2ECDF; --card:#FFFDF8; --line:#E6DFD0; --line-strong:#BDB6A6;
  --lav:#6E67C4; --lav-soft:#ECEAFB; --coral:#F28C72; --coral-deep:#C9563C; --coral-soft:#FDE7DF;
  --yellow:#F3C96B; --yellow-soft:#FCF1D6; --green-soft:#DCEBDD; --sky-soft:#E3F2F8;
  --ink:#15261F; --muted:#5E665C; --danger:#B83A32; --ok:#2E7D5B;
  --attn:#4A43A3; --toast-bg:#103D38; --toast-fg:#FFFFFF; --note-fg:#1E4E63; --warm-fg:#6B4A0E;
  --nav-bg:rgba(255,253,248,.96); --logo-sun:#F3C96B;
  --font-d:"Bricolage Grotesque","Avenir Next",system-ui,sans-serif;
  --font-b:"Figtree",-apple-system,"Segoe UI",system-ui,sans-serif;
  --r-xl:26px; --r-lg:20px; --r-md:16px; --r-sm:12px;
  --shadow:0 1px 2px rgba(16,61,56,.06),0 10px 24px -14px rgba(16,61,56,.22);
  --nav-h:68px;
  color-scheme:light;
}
html.th-monsoon{--ever:#1F4E63;--ever-2:#2C6E7D;--teal:#163B4B;--ivory:#EEF3F2;--cream:#E1E9E8;--card:#FFFFFF;--line:#D3DEDE;--line-strong:#A9BBBD;--ink:#12242B;--muted:#53666C;--green-soft:#DCEAF0;--coral:#F2B33D;--coral-deep:#A8650E;--coral-soft:#FCEBCB;--sky-soft:#DDEBF1;--attn:#2C6E7D;--toast-bg:#1F4E63;--nav-bg:rgba(255,255,255,.96);--logo-sun:#F2B33D;--font-d:"Fraunces",Georgia,serif}
html.th-masala{--ever:#8A2B1F;--ever-2:#A4502F;--teal:#5E1D14;--ivory:#F8EEDF;--cream:#EFDFC8;--card:#FFF8EC;--line:#E8D4B9;--line-strong:#C9AE8E;--ink:#2B1710;--muted:#6E5244;--green-soft:#F5DEC6;--coral:#E9A23B;--coral-deep:#A0561A;--coral-soft:#FBE6CC;--sky-soft:#F3E3D3;--note-fg:#5E2A16;--attn:#6B2D5C;--toast-bg:#2B1710;--nav-bg:rgba(255,248,236,.96);--logo-sun:#E9A23B;--font-d:"Young Serif",Georgia,serif}
html.m-dark{--ever:#5FCFAE;--ever-2:#7ADBBD;--on-ever:#06231D;--teal:#EAF4EF;--ivory:#0E1A17;--cream:#1A2A26;--card:#15241F;--line:#25382F;--line-strong:#46605A;--ink:#EAF4EF;--muted:#9DB3AA;--green-soft:#1E3530;--coral:#F28C72;--coral-deep:#FF9C82;--coral-soft:#3A2622;--yellow-soft:#2E2A1C;--sky-soft:#18303A;--lav-soft:#232842;--note-fg:#BFD8E6;--warm-fg:#F0D9A0;--attn:#3B3592;--toast-bg:#5FCFAE;--toast-fg:#06231D;--danger:#FF8A7A;--ok:#7ADBBD;--nav-bg:rgba(21,36,31,.96);--logo-sun:#F3C96B;--shadow:0 1px 2px rgba(0,0,0,.3),0 10px 24px -14px rgba(0,0,0,.6);color-scheme:dark}
html.th-masala.m-dark{--ever:#F0A35E;--ever-2:#F5B97F;--on-ever:#2A1206;--teal:#F7E6D6;--ivory:#1E120D;--cream:#2C1C15;--card:#26170F;--line:#3E2A1F;--line-strong:#6A4E3E;--ink:#F7E6D6;--muted:#C4A895;--green-soft:#3A2418;--coral:#E9A23B;--coral-deep:#FF9C82;--coral-soft:#3A2622;--yellow-soft:#33281A;--sky-soft:#2E211A;--note-fg:#F0D2BF;--attn:#7A3368;--toast-bg:#F0A35E;--toast-fg:#2A1206;--ok:#8FD6A6;--nav-bg:rgba(38,23,15,.96);--logo-sun:#2A1206}
html.th-monsoon.m-dark{--ever:#7FC4DD;--ever-2:#9AD3E7;--on-ever:#082029;--teal:#E6F1F4;--ivory:#0D1A20;--cream:#18282F;--card:#13232A;--line:#24363E;--line-strong:#4A6570;--ink:#E6F1F4;--muted:#9DB4BC;--green-soft:#1B323B;--coral:#F2B33D;--coral-deep:#FFB26B;--coral-soft:#3A2C1A;--sky-soft:#17303A;--note-fg:#BFD8E6;--attn:#2C6E7D;--toast-bg:#7FC4DD;--toast-fg:#082029;--ok:#7FD6B4;--nav-bg:rgba(19,35,42,.96);--logo-sun:#F2B33D}
.cover .tl{flex-direction:row;align-items:flex-start}
*{box-sizing:border-box}
html,body{background:var(--ivory);color:var(--ink)}
body{font-family:var(--font-b);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--ivory)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,select,textarea{font:inherit;color:var(--ink)}
a{color:inherit}
:focus-visible{outline:3px solid var(--yellow);outline-offset:2px;border-radius:10px}
.app{max-width:480px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(var(--nav-h) + 40px + env(safe-area-inset-bottom,0px))}
.app.chatmode{padding-block-end:calc(var(--nav-h) + 92px + env(safe-area-inset-bottom,0px))}
.ic{flex:none;display:block}
h1,h2,h3{font-family:var(--font-d);margin:0;text-wrap:balance;letter-spacing:-.01em}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}

.topbar{box-shadow:0 0 0 100vmax var(--ivory);clip-path:inset(0 -100vmax);position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--ivory);display:flex;align-items:center;gap:10px;padding-block:14px 10px}
.topbar h1{font-size:27px;font-weight:800;color:var(--teal);flex:1;min-width:0}
.iconbtn{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:var(--teal);background:var(--card);border:1px solid var(--line);flex:none;text-decoration:none}
.iconbtn.solid{background:var(--ever);color:var(--on-ever);border-color:var(--ever)}
.brand{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.logo{width:44px;height:44px;border-radius:14px;background:var(--ever);color:var(--on-ever);display:grid;place-items:center;flex:none}
.brand b{font-family:var(--font-d);font-size:26px;font-weight:800;color:var(--teal);line-height:1;display:block}
.brand small{font-size:12.5px;color:var(--muted)}

.nav{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--nav-bg);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.nav-in{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);height:var(--nav-h)}
.nav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11.5px;font-weight:600;color:var(--muted)}
.nav .pill{width:52px;height:30px;border-radius:15px;display:grid;place-items:center;transition:background .2s}
.nav button[aria-current="page"]{color:var(--ever)}
.nav button[aria-current="page"] .pill{background:var(--green-soft)}

.seg{display:flex;background:var(--cream);border-radius:999px;padding:4px;gap:4px}
.seg button{flex:1;min-width:0;height:38px;border-radius:999px;font-weight:600;font-size:14px;color:var(--muted);white-space:nowrap;padding:0 6px}
.seg button.on{background:var(--ever);color:var(--on-ever);box-shadow:0 4px 10px -4px rgba(0,0,0,.3)}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-block:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:34px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:13.5px;font-weight:600;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.chip.on{background:var(--ever);border-color:var(--ever);color:var(--on-ever)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:50px;padding:0 22px;border-radius:999px;font-weight:700;font-size:15.5px;background:var(--ever);color:var(--on-ever);text-decoration:none;text-align:center}
.btn:active{transform:scale(.98)}
.btn.block{width:100%}
.btn.soft{background:var(--green-soft);color:var(--ever)}
.btn.ghost{background:var(--card);color:var(--teal);border:1.5px solid var(--line)}
.btn.coral{background:var(--coral);color:#3A140B}
.btn.danger{background:var(--coral-soft);color:var(--danger)}
.btn.sm{height:38px;padding:0 14px;font-size:13.5px}
.btn[disabled]{opacity:.45;pointer-events:none}
.row{display:flex;align-items:center;gap:10px}
.stack{display:flex;flex-direction:column;gap:12px}
.section{display:flex;flex-direction:column;gap:12px;margin-top:22px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.sec-h h2{font-size:19px;font-weight:700;color:var(--teal)}
.link-btn{font-size:13.5px;font-weight:700;color:var(--ever)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow)}
.pillt{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 9px;border-radius:999px;font-size:11.5px;font-weight:700;letter-spacing:.02em;white-space:nowrap}
.p-prop{background:#E3F2F8;color:#235F7A}
.p-short{background:#FCF1D6;color:#7A5410}
.p-conf{background:#DCEBDD;color:#064E43}
.p-high{background:#FDE7DF;color:#A8442D}
.p-lav{background:#ECEAFB;color:#3E3891}
.p-demo{background:rgba(255,255,255,.88);color:#103D38}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

.av{flex:none;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-family:var(--font-b);box-shadow:0 0 0 2px var(--card)}
.avs{display:flex;align-items:center}
.avs .av+.av{margin-left:-8px}
.avs .more{margin-left:-8px;background:var(--cream);color:var(--teal);font-size:11px}

.ill{flex:none;border-radius:16px;display:grid;place-items:center;overflow:hidden}
.ill svg{width:78%;height:78%}

.cover{position:relative;border-radius:var(--r-xl);overflow:hidden;aspect-ratio:16/10;max-width:100%;box-shadow:var(--shadow)}
.cover svg.scene{position:absolute;inset:0;width:100%;height:100%}
.cover::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,30,26,0) 45%,rgba(10,30,26,.6))}
.cover .over{position:absolute;inset:auto 0 0 0;z-index:2;padding:18px;display:flex;flex-direction:column;gap:10px}
.cover h2{color:#fff;font-size:32px;font-weight:800;line-height:1.02;text-shadow:0 2px 12px rgba(0,0,0,.2)}
.cover .tl{position:absolute;top:12px;left:12px;right:12px;z-index:2;display:flex;justify-content:space-between;gap:8px}
.syncpill{display:inline-flex;align-items:center;gap:7px;height:30px;padding:0 12px;border-radius:999px;background:rgba(255,255,255,.92);color:#103D38;font-size:12.5px;font-weight:700}
.syncpill i{width:8px;height:8px;border-radius:50%;background:#2E7D5B;display:block}
.syncpill i.wait{background:#C98A16;animation:blink 1s ease-in-out infinite}
.syncpill i.off{background:#B83A32}
.syncpill i.local{background:#8A8F86}
@keyframes blink{50%{opacity:.3}}
.going{display:inline-flex;align-items:center;gap:8px;background:rgba(255,253,248,.92);border-radius:999px;padding:4px 6px 4px 12px;font-weight:700;font-size:13px;color:#103D38}
.meta{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:14px;color:var(--muted);font-weight:600;padding-inline:4px}
.meta span{display:inline-flex;align-items:center;gap:6px}
.attn{border-radius:var(--r-xl);padding:18px;color:#fff;background:var(--attn);box-shadow:0 14px 30px -18px rgba(0,0,0,.55)}
.attn h3{font-size:18px;font-weight:700;display:flex;align-items:center;justify-content:space-between;gap:8px}
.attn .count{width:28px;height:28px;border-radius:50%;background:#fff;color:var(--attn);display:grid;place-items:center;font-size:14px;flex:none}
.attn ul{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-direction:column}
.attn li button{width:100%;display:flex;align-items:center;gap:12px;padding:11px 2px;border-top:1px solid rgba(255,255,255,.18);text-align:left;font-weight:600;font-size:14.5px;color:#fff}
.attn .dot{width:32px;height:32px;border-radius:10px;background:rgba(255,255,255,.14);display:grid;place-items:center;flex:none}
.attn .go{margin-left:auto;opacity:.75}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{display:flex;align-items:center;gap:12px;padding:12px;text-align:left;border-radius:var(--r-lg);min-width:0}
.tile b{display:block;font-family:var(--font-d);font-size:16px;color:var(--teal)}
.tile small{color:var(--muted);font-weight:600;font-size:12.5px}
.fab{position:fixed;z-index:24;right:max(18px,calc(50% - 222px));bottom:calc(var(--nav-h) + 16px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:20px;background:var(--coral);color:#3A140B;display:grid;place-items:center;box-shadow:0 12px 24px -10px rgba(0,0,0,.45)}
.today{padding:16px;display:flex;flex-direction:column;gap:12px;border-radius:var(--r-xl)}
.today .big{font-family:var(--font-d);font-size:22px;font-weight:800;color:var(--teal);line-height:1.15}
.today .when{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:13px;color:var(--ever)}
.later{display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--line);padding-top:10px}
.later div{display:flex;gap:10px;font-size:13.5px}
.later b{width:66px;flex:none;color:var(--muted);font-weight:700}

.days{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(92px,1fr);gap:8px;overflow-x:auto;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.day{border-radius:var(--r-md);padding:9px 10px;background:var(--cream);text-align:center;font-weight:700;color:var(--teal);font-size:14.5px}
.day small{display:block;font-weight:600;font-size:12px;color:var(--muted)}
.day.on{background:var(--ever);color:var(--on-ever)}
.day.on small{color:inherit;opacity:.8}
.tl{display:flex;flex-direction:column;gap:12px}
.tl-item{display:grid;grid-template-columns:56px 1fr;gap:10px;align-items:start}
.tl-time{font-weight:700;font-size:13px;color:var(--teal);padding-top:14px;text-align:right}
.tl-time small{display:block;color:var(--muted);font-weight:600;font-size:11.5px}
.act{display:flex;gap:12px;padding:10px;align-items:center;min-width:0}
.act-main{display:flex;gap:12px;align-items:center;flex:1;min-width:0;text-align:left}
.act .t{flex:1;min-width:0}
.act b{display:block;font-size:15.5px;line-height:1.25}
.act .sub{font-size:12.5px;color:var(--muted);font-weight:600;margin-top:2px;display:block}
.act .foot{display:flex;align-items:center;gap:8px;margin-top:7px;flex-wrap:wrap}
.act.drive{border-style:dashed;border-width:1.5px}
.mv{display:flex;flex-direction:column;gap:4px}
.mv button{width:30px;height:28px;border-radius:9px;background:var(--cream);display:grid;place-items:center;color:var(--teal)}
.mv button[disabled]{opacity:.3}
.idea{padding:12px;display:flex;gap:12px}
.idea .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.idea b{font-family:var(--font-d);font-size:17px;color:var(--teal);line-height:1.2}
.idea p{margin:0;font-size:13.5px;color:var(--muted)}
.idea .foot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:6px}
.vote{height:36px;padding:0 14px;border-radius:999px;background:var(--ever);color:var(--on-ever);font-weight:700;font-size:13.5px;display:inline-flex;align-items:center;gap:6px}
.vote.on{background:var(--green-soft);color:var(--ever)}
.votes-n{font-size:12.5px;font-weight:700;color:var(--muted)}
.linkcard{display:flex;gap:12px;padding:10px;align-items:center}
.linkcard .t{flex:1;min-width:0}
.linkcard b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.linkcard small{display:block;color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.note{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:var(--r-md);background:var(--sky-soft);color:var(--note-fg);font-size:13.5px;font-weight:500}
.note.warm{background:var(--yellow-soft);color:var(--warm-fg)}
.empty{text-align:center;padding:26px 18px;display:flex;flex-direction:column;align-items:center;gap:10px}
.empty b{font-family:var(--font-d);font-size:18px;color:var(--teal)}
.empty p{margin:0;color:var(--muted);font-size:14px;max-width:30ch}

.route{padding:12px;display:flex;flex-direction:column;gap:10px}
.route .top{display:flex;gap:12px;align-items:center;text-align:left;width:100%}
.route .t{flex:1;min-width:0}
.route b{display:block;font-size:15.5px;line-height:1.25}
.route small{display:block;color:var(--muted);font-size:12.5px;font-weight:600}
.legs{display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px;font-size:12.5px;font-weight:600;color:var(--ink)}
.legs span{background:var(--cream);border-radius:8px;padding:3px 8px}
.legs i{color:var(--muted);font-style:normal}
.route .acts{display:flex;gap:8px;flex-wrap:wrap}

.poll{padding:14px;display:flex;flex-direction:column;gap:10px}
.poll h3{font-size:17px;color:var(--teal)}
.popt{position:relative;display:flex;align-items:center;gap:10px;width:100%;min-height:46px;padding:8px 12px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);text-align:left;overflow:hidden}
.popt .fill{position:absolute;inset:0 auto 0 0;background:var(--green-soft);z-index:0;transition:width .3s}
.popt>*:not(.fill){position:relative;z-index:1}
.popt .lbl{flex:1;min-width:0;font-weight:700;font-size:14.5px}
.popt.mine{border-color:var(--ever)}
.popt .tick{width:22px;height:22px;border-radius:50%;border:2px solid var(--line-strong);display:grid;place-items:center;color:transparent;flex:none}
.popt.mine .tick{background:var(--ever);border-color:var(--ever);color:var(--on-ever)}
.popt.win{border-color:var(--ever);border-width:2px}

.progress{padding:16px;display:flex;gap:14px;align-items:center}
.bar{height:10px;border-radius:999px;background:var(--cream);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;border-radius:999px;background:var(--ever);transition:width .4s}
.bar i.warn{background:#D9A12B}
.bar i.over{background:var(--coral-deep)}
.task{display:flex;align-items:center;gap:12px;padding:12px}
.task .t{flex:1;min-width:0;text-align:left}
.task b{display:block;font-size:15.5px;font-weight:600}
.task .desc{font-size:13px;color:var(--muted);margin-top:1px}
.task .foot{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin-top:6px;font-size:12.5px;font-weight:600;color:var(--muted)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--space-2);min-height:50px;padding:0 22px;border-radius:var(--radius-md);font-family:var(--font-display);font-weight:700;font-size:25px;line-height:1;background:var(--color-surface);color:var(--color-primary);border:2.5px solid var(--color-primary);text-decoration:none;text-align:center;transition:transform .1s ease}
.btn:active{transform:rotate(-1.5deg) scale(.97)}
.btn.block{width:100%}
.btn.ghost{background:none;border-color:transparent;color:var(--color-text);text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:5px;padding:0 10px}
.btn.soft{background:var(--hl);color:var(--color-text);border-color:var(--pen)}
.btn.coral{background:var(--color-surface);color:var(--color-primary)}
.btn.danger{background:none;border-color:var(--color-danger);color:var(--color-danger)}
.btn.sm{min-height:44px;padding:0 14px;font-size:21px}
.btn[disabled]{opacity:.45;pointer-events:none}
.row{display:flex;align-items:center;gap:10px}
.stack{display:flex;flex-direction:column;gap:var(--space-4)}
.section{display:flex;flex-direction:column;gap:var(--space-4);margin-top:var(--space-6)}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:var(--space-2)}
.sec-h h2{font-size:30px;color:var(--color-text);background:linear-gradient(180deg,transparent 45%,var(--hl) 45% 85%,transparent 85%);padding:0 4px}
.link-btn{font-size:17px;color:var(--color-primary);min-height:44px;display:inline-flex;align-items:center;gap:4px;text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:4px}

/* Cards: sticky notes, rotated slightly, pen outline. Feature notes get tape. */
.card{position:relative;background:var(--color-surface);border:2px solid var(--pen);border-radius:var(--radius-md);box-shadow:var(--shadow-1);transform:rotate(-.4deg)}
.card:nth-child(even){transform:rotate(.45deg)}
.today::before,.progress::before,.poll::before,.empty::before,.recap::before,.cover::before,.attn::before,.total::before{content:"";position:absolute;z-index:3;top:-12px;left:50%;width:84px;height:24px;margin-left:-42px;background:var(--tape);border-left:2px dotted color-mix(in srgb,var(--pen) 25%,transparent);border-right:2px dotted color-mix(in srgb,var(--pen) 25%,transparent);transform:rotate(-4deg)}
.pillt{display:inline-flex;align-items:center;gap:4px;min-height:24px;padding:0 9px;border-radius:var(--radius-md);font-size:14.5px;white-space:nowrap;color:var(--ink-note);border:1.5px solid var(--ink-note)}
.p-prop{background:color-mix(in srgb,var(--color-border) 55%,#fff)}
.p-short{background:var(--color-secondary)}
.p-conf{background:var(--color-quaternary)}
.p-high{background:var(--color-tertiary)}
.p-lav{background:color-mix(in srgb,var(--color-border) 55%,#fff)}
.p-demo{background:var(--color-secondary)}
.eyebrow{font-size:15px;letter-spacing:.06em;text-transform:uppercase;color:var(--color-text-muted)}

.av{flex:none;border-radius:var(--wobble);display:grid;place-items:center;color:var(--ink-note);font-family:var(--font-body);border:1.5px solid var(--ink-note);box-shadow:0 0 0 2px var(--color-surface)}
.avs{display:flex;align-items:center}
.avs .av+.av{margin-left:-8px}
.avs .more{margin-left:-8px;background:var(--color-surface);color:var(--color-text);border-color:var(--pen);font-size:12px}

/* Doodles: pen-drawn illustrations in wobbly circles */
.ill{flex:none;border-radius:var(--wobble)!important;display:grid;place-items:center;overflow:hidden;border:2px solid var(--pen)}
.ill svg{width:76%;height:76%}

/* Trip cover: a pen sketch on the page */
.cover::before{left:36%!important}
.cover{position:relative;border-radius:var(--radius-lg);aspect-ratio:16/12.5;max-width:100%;border:2px solid var(--pen);background:var(--color-surface);box-shadow:var(--shadow-1);transform:rotate(-.6deg)}
.cover svg.scene{position:absolute;inset:0;width:100%;height:100%;border-radius:inherit}
.cover .over{position:absolute;inset:auto 0 0 0;z-index:2;padding:12px 16px 14px;display:flex;flex-direction:column;gap:6px}
.cover h2{color:var(--color-text);font-size:46px;line-height:.95}
.cover .tl{position:absolute;top:12px;left:12px;right:12px;z-index:2;display:flex;flex-direction:row;justify-content:space-between;align-items:flex-start;gap:8px}
.syncpill{display:inline-flex;align-items:center;gap:7px;min-height:44px;padding:0 12px;border-radius:var(--radius-md);background:var(--color-surface);color:var(--color-text);font-size:15px;border:2px solid var(--pen)}
.syncpill i{width:10px;height:10px;border-radius:50%;background:var(--success);display:block}
.syncpill i.wait{background:var(--color-secondary);border:1.5px solid var(--pen);animation:blink 1s ease-in-out infinite}
.syncpill i.off{background:var(--color-danger)}
.syncpill i.local{background:var(--color-text-muted)}
@keyframes blink{50%{opacity:.3}}
.going{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 4px;font-size:17px;color:var(--color-text);white-space:nowrap}
.meta{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:17px;color:var(--color-text-muted);padding-inline:4px}
.meta span{display:inline-flex;align-items:center;gap:6px}

/* Attention: a yellow sticky note with tape */
.attn{position:relative;border-radius:var(--radius-md);padding:var(--space-5) var(--space-5) var(--space-4);color:var(--ink-note);background:var(--color-secondary);border:2px solid var(--ink-note);box-shadow:var(--shadow-1);transform:rotate(.6deg)}
.attn h3{font-size:30px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.attn .count{width:34px;height:34px;border-radius:var(--wobble);border:2px solid var(--ink-note);display:grid;place-items:center;font-family:var(--font-display);font-size:22px;flex:none}
.attn ul{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column}
.attn li button{width:100%;display:flex;align-items:center;gap:12px;min-height:48px;padding:6px 2px;border-bottom:1.5px solid color-mix(in srgb,var(--ink-note) 30%,transparent);text-align:left;font-size:17.5px;color:var(--ink-note)}
.attn .dot{width:34px;height:34px;border-radius:var(--wobble);border:2px solid var(--ink-note);display:grid;place-items:center;flex:none}
.attn .go{margin-left:auto}
.attn .btn.coral{background:var(--color-surface);color:var(--color-primary);border-color:var(--color-primary)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-4)}
.tile{display:flex;align-items:center;gap:12px;padding:12px;text-align:left;min-width:0}
.tile b{display:block;font-family:var(--font-display);font-weight:700;font-size:25px;line-height:1;color:var(--color-text)}
.tile small{color:var(--color-text-muted);font-size:15px}
.fab{position:fixed;z-index:24;right:max(18px,calc(50% - 222px));bottom:calc(var(--nav-h) + 16px + env(safe-area-inset-bottom,0px));width:60px;height:60px;border-radius:var(--wobble);background:var(--color-surface);color:var(--color-primary);border:2.5px solid var(--color-primary);box-shadow:var(--shadow-1);display:grid;place-items:center;transform:rotate(-6deg)}
.today{padding:var(--space-5) var(--space-4) var(--space-4);display:flex;flex-direction:column;gap:var(--space-3)}
.today .big{font-family:var(--font-display);font-weight:700;font-size:34px;color:var(--color-text);line-height:1}
.today .when{display:inline-flex;align-items:center;gap:6px;font-size:16px;color:var(--color-primary)}
.later{display:flex;flex-direction:column;gap:2px;border-top:2px dashed var(--rule-line);padding-top:8px}
.later div{display:flex;gap:10px;font-size:16.5px;min-height:30px;align-items:center;border-bottom:1px solid var(--rule-line)}
.later b{width:72px;flex:none;color:var(--color-text-muted)}

/* Plan */
.days{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(92px,1fr);gap:var(--space-2);overflow-x:auto;scrollbar-width:none;padding:4px 2px 6px}
.days::-webkit-scrollbar{display:none}
.day{border-radius:var(--radius-md);padding:6px 10px;background:var(--color-surface);border:2px solid var(--rule-strong);text-align:center;color:var(--color-text);font-family:var(--font-display);font-weight:700;font-size:24px;line-height:1;min-height:56px}
.day small{display:block;font-family:var(--font-body);font-weight:400;font-size:15px;color:var(--color-text-muted)}
.day.on{border-color:var(--color-primary);color:var(--color-primary);background:var(--hl);transform:rotate(-2deg)}
.day.on small{color:var(--color-text)}
.tl{display:flex;flex-direction:column;gap:var(--space-4)}
.tl-item{display:grid;grid-template-columns:58px 1fr;gap:10px;align-items:start}
.tl-time{font-family:var(--font-display);font-weight:700;font-size:22px;line-height:1;color:var(--color-text);padding-top:16px;text-align:right}
.tl-time small{display:block;font-family:var(--font-body);color:var(--color-text-muted);font-size:14px;font-weight:400}
.act{display:flex;gap:12px;padding:10px;align-items:center;min-width:0}
.act-main{display:flex;gap:12px;align-items:center;flex:1;min-width:0;text-align:left;min-height:44px}
.act .t{flex:1;min-width:0}
.act b{display:block;font-size:19px;line-height:1.2}
.act .sub{font-size:15px;color:var(--color-text-muted);margin-top:2px;display:block}
.act .foot{display:flex;align-items:center;gap:8px;margin-top:6px;flex-wrap:wrap}
.act.drive{border-style:dashed}
.mv{display:flex;flex-direction:column;gap:6px}
.mv button{position:relative;width:32px;height:32px;border-radius:var(--wobble);border:2px solid var(--pen);display:grid;place-items:center;color:var(--color-text);background:var(--color-surface)}
.mv button::after,.chk::after,.tog::after{content:"";position:absolute;inset:-8px}
.mv button[disabled]{opacity:.35}
.idea{padding:12px;display:flex;gap:12px}
.idea .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.idea b{font-family:var(--font-display);font-weight:700;font-size:27px;color:var(--color-text);line-height:1}
.idea p{margin:0;font-size:16px;color:var(--color-text-muted)}
.idea .foot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:6px;flex-wrap:wrap}
.vote{min-height:44px;padding:0 14px;border-radius:var(--radius-md);color:var(--color-primary);border:2px solid var(--color-primary);background:var(--color-surface);font-family:var(--font-display);font-weight:700;font-size:22px;display:inline-flex;align-items:center;gap:6px}
.vote.on{background:var(--hl);color:var(--color-text);border-color:var(--pen)}
.votes-n{font-size:15px;color:var(--color-text-muted)}
.linkcard{display:flex;gap:12px;padding:10px;align-items:center}
.linkcard .t{flex:1;min-width:0}
.linkcard b{display:block;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.linkcard small{display:block;color:var(--color-text-muted);font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.note{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;font-size:16.5px;color:var(--color-text);border-left:3px solid var(--margin-line);background:linear-gradient(180deg,transparent 0,transparent),repeating-linear-gradient(180deg,transparent 0 25px,var(--rule-line) 25px 26px)}
.note.warm{border-left-color:var(--color-secondary)}
.empty{text-align:center;padding:26px 18px;display:flex;flex-direction:column;align-items:center;gap:10px}
.empty b{font-family:var(--font-display);font-weight:700;font-size:30px;color:var(--color-text)}
.empty p{margin:0;color:var(--color-text-muted);font-size:16.5px;max-width:30ch}

.route{padding:12px;display:flex;flex-direction:column;gap:10px}
.route .top{display:flex;gap:12px;align-items:center;text-align:left;width:100%;min-height:44px}
.route .t{flex:1;min-width:0}
.route b{display:block;font-size:19px;line-height:1.2}
.route small{display:block;color:var(--color-text-muted);font-size:15px}
.legs{display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px;font-size:16px;color:var(--color-text)}
.legs span{background:linear-gradient(180deg,transparent 35%,var(--hl) 35% 90%,transparent 90%);padding:0 4px}
.legs i{color:var(--color-text-muted);font-style:normal}
.route .acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.poll{padding:16px 14px 14px;display:flex;flex-direction:column;gap:8px}
.poll h3{font-size:30px;color:var(--color-text)}
.popt{position:relative;display:flex;align-items:center;gap:12px;width:100%;min-height:48px;padding:6px 4px;border-bottom:1.5px solid var(--rule-line);background:none;text-align:left;overflow:visible}
.popt .fill{position:absolute;left:0;top:22%;bottom:18%;background:var(--hl);z-index:0;transition:width .3s;border-radius:3px}
.popt>*:not(.fill){position:relative;z-index:1}
.popt .lbl{flex:1;min-width:0;font-size:18px}
.popt .tick{width:24px;height:24px;border-radius:var(--radius-sm);border:2px solid var(--pen);display:grid;place-items:center;color:transparent;flex:none;background:var(--color-surface);overflow:visible;position:relative}
.popt .tick .ic{width:28px;height:28px;position:absolute;left:1px;top:-9px;stroke-width:2.6}
.popt.mine .tick{color:var(--color-primary)}
.popt.win .lbl{font-family:var(--font-display);font-weight:700;font-size:25px;line-height:1}

/* Tasks: a checklist on ruled lines. Ticks overshoot the box, done items are crossed out. */
.progress{padding:18px 16px 16px;display:flex;gap:14px;align-items:center}
.bar{height:14px;border-radius:var(--radius-md);background:var(--color-surface);border:2px solid var(--pen);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:repeating-linear-gradient(-55deg,var(--color-quaternary) 0 5px,color-mix(in srgb,var(--color-quaternary) 55%,var(--color-surface)) 5px 9px);transition:width .4s}
.bar i.warn{background:var(--color-secondary)}
.bar i.over{background:var(--color-danger)}
.task{display:flex;align-items:center;gap:14px;padding:10px 10px 10px 2px}
.task .t{flex:1;min-width:0;text-align:left;min-height:44px}
.task b{display:block;font-size:19px}
.task .desc{font-size:15.5px;color:var(--color-text-muted);margin-top:1px}
.task .foot{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin-top:5px;font-size:15px;color:var(--color-text-muted)}
.task.done b{text-decoration:line-through;text-decoration-thickness:2px;text-decoration-color:var(--color-danger);color:var(--color-text-muted)}
.chk{position:relative;width:28px;height:28px;border-radius:var(--radius-sm);border:2px solid var(--pen);background:var(--color-surface);display:grid;place-items:center;flex:none;color:transparent;overflow:visible;transform:rotate(-3deg)}
.chk .ic{position:absolute;width:36px;height:36px;left:2px;top:-13px;stroke-width:2.8}
.chk.on{color:var(--color-primary)}
.chk.pop{animation:pop .35s ease}
@keyframes pop{50%{transform:scale(1.15) rotate(-3deg)}}
.due{display:inline-flex;align-items:center;gap:4px}
.due.late{color:var(--color-danger)}
.list{display:flex;flex-direction:column}
.list>*+*{border-top:1.5px solid var(--rule-line)}
.kit{display:flex;align-items:center;gap:12px;padding:10px 10px 10px 2px;flex-wrap:wrap}
.kit .t{flex:1;min-width:0}
.kit b{display:block;font-size:18.5px}
.kit small{color:var(--color-text-muted);font-size:15px}
.kit.packed b{text-decoration:line-through;text-decoration-thickness:2px;text-decoration-color:var(--color-danger);color:var(--color-text-muted)}
.addrow{display:flex;gap:8px;align-items:flex-end}
.addrow input{flex:1;min-width:0}

/* Money */
.total{position:relative;border-radius:var(--radius-md);padding:var(--space-5);color:var(--ink-note);background:var(--color-quaternary);border:2px solid var(--ink-note);box-shadow:var(--shadow-1);transform:rotate(-.5deg)}
.total .lbl{font-size:17px}
.total .big{font-family:var(--font-display);font-weight:700;font-size:54px;line-height:1;margin-top:2px}
.total .wallet{position:absolute;right:12px;top:16px;width:70px;height:70px;transform:rotate(8deg)}
.mini3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.mini3 div{background:var(--color-surface);color:var(--color-text);border:1.5px solid var(--ink-note);border-radius:var(--radius-md);padding:8px 10px;min-width:0}
.mini3 small{display:block;font-size:14px}
.mini3 b{font-size:18px}
.exp{display:flex;align-items:center;gap:12px;padding:10px 10px 10px 2px;width:100%;text-align:left}
.exp .t{flex:1;min-width:0}
.exp b{display:block;font-size:18.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.exp small{display:block;color:var(--color-text-muted);font-size:15px}
.exp .amt{text-align:right;font-family:var(--font-display);font-weight:700;font-size:25px;line-height:1;flex:none}
.exp .amt small{font-family:var(--font-body);font-weight:400}
.bal{display:flex;align-items:center;gap:12px;padding:10px 10px 10px 2px;min-height:56px}
.bal .t{flex:1;min-width:0}
.bal .v{font-family:var(--font-display);font-weight:700;font-size:26px}
.pos{color:var(--success)} .neg{color:var(--color-danger)}
.xfer{padding:14px;display:flex;flex-direction:column;gap:10px}
.xfer .who{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:17.5px}
.xfer .amt{font-family:var(--font-display);font-weight:700;font-size:32px;color:var(--color-text);margin-left:auto}
.xfer .acts{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.calc{font-size:16.5px;color:var(--color-text-muted);line-height:1.5}
.calc b{color:var(--color-text)}
.brow{display:flex;align-items:center;gap:12px;padding:10px 10px 10px 2px}
.brow .t{flex:1;min-width:0}
.brow b{font-size:18.5px}
.brow .fig{display:flex;justify-content:space-between;gap:8px;font-size:15px;color:var(--color-text-muted)}

.ticket{display:flex;align-items:stretch;overflow:hidden;padding:0}
.ticket .stub{width:80px;display:grid;place-items:center;border-right:2px dashed var(--pen);flex:none}
.ticket .t{flex:1;min-width:0;padding:12px 12px 12px 14px;display:flex;flex-direction:column;gap:2px}
.ticket b{font-size:19px}
.ticket .ref{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:15px;font-weight:700;letter-spacing:.04em;color:var(--color-text);background:linear-gradient(180deg,transparent 30%,var(--hl) 30% 92%,transparent 92%);align-self:flex-start;padding:0 4px}
.ticket small{color:var(--color-text-muted);font-size:15px}

/* Chat */
.msgs{display:flex;flex-direction:column;gap:14px;padding-top:6px}
.msg{display:flex;gap:8px;align-items:flex-end;max-width:86%}
.msg.me{align-self:flex-end;flex-direction:row-reverse}
.bub{background:var(--color-surface);border:2px solid var(--pen);border-radius:var(--radius-md);padding:8px 13px;min-width:0;overflow-wrap:anywhere;font-size:17.5px;transform:rotate(-.4deg)}
.msg.me .bub{border-color:var(--color-primary);background:color-mix(in srgb,var(--color-border) 22%,var(--color-surface));transform:rotate(.4deg)}
.bub .nm{font-size:15px;margin-bottom:1px}
.bub .ts{font-size:13.5px;color:var(--color-text-muted);text-align:right;margin-top:2px}
.bub a{color:var(--color-primary)}
.refcard{display:flex;gap:10px;align-items:center;margin-top:6px;padding:8px;border-radius:var(--radius-md);background:var(--color-bg);color:var(--color-text);border:1.5px dashed var(--pen);text-align:left;width:100%;min-height:44px}
.refcard b{display:block;font-size:16.5px}
.refcard small{display:block;font-size:14px;color:var(--color-text-muted)}
.composer{position:fixed;left:0;right:0;z-index:24;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px));background:var(--color-bg);border-top:1.5px solid var(--rule-line);padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));padding-block:8px}
.composer form{max-width:480px;margin:0 auto;display:flex;gap:10px;align-items:center}
.composer input{flex:1;min-width:0;height:46px;border:0;border-bottom:2px solid var(--rule-strong);border-radius:0;background:none;padding:0 4px;font-size:18px}
.composer input:focus{outline:none;border-bottom-color:var(--color-primary)}
.tripbar{display:flex;align-items:center;gap:10px;padding:10px 12px;width:100%;text-align:left;min-height:56px}
.tripbar b{display:block;font-size:18px}
.tripbar small{color:var(--color-text-muted);font-size:15px}

/* Sheets: a torn notebook page sliding up */
.scrim{position:fixed;inset:0;z-index:40;background:var(--scrim);opacity:0;transition:opacity .2s}
.scrim.show{opacity:1}
.sheet{position:fixed;z-index:41;left:0;right:0;bottom:0;margin:0 auto;max-width:480px;max-height:92dvh;overflow-y:auto;overscroll-behavior:contain;
  background:linear-gradient(90deg,transparent 0 30px,var(--margin-line) 30px 32px,transparent 32px),repeating-linear-gradient(180deg,transparent 0 33px,var(--rule-line) 33px 34px),var(--color-surface);background-attachment:local;

.sheet.show{transform:none}
.grab{width:46px;height:4px;border-radius:3px;background:var(--rule-strong);margin:4px auto 8px}
.sheet-h{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.sheet-h h2{flex:1;font-size:38px;color:var(--color-text)}
.field{display:flex;flex-direction:column;gap:2px;min-width:0}
.field label,.flabel{font-size:16px;color:var(--color-text-muted)}
/* Inputs: write on the ruled line, no box */
.inp{min-height:46px;border:0;border-bottom:2px solid var(--rule-strong);border-radius:0;background:none;padding:0 4px;font-size:19px;width:100%;min-width:0;color:var(--color-text)}
textarea.inp{height:auto;min-height:72px;padding:6px 4px;resize:vertical;line-height:34px;background:repeating-linear-gradient(180deg,transparent 0 33px,var(--rule-line) 33px 34px)}
select.inp{-webkit-appearance:none;appearance:none;background:linear-gradient(45deg,transparent 45%,var(--pen) 45% 55%,transparent 55%) right 10px center/8px 8px no-repeat,linear-gradient(-45deg,transparent 45%,var(--pen) 45% 55%,transparent 55%) right 4px center/8px 8px no-repeat}
.inp:focus{outline:none;border-bottom-color:var(--color-primary)}
.inp.bad{border-bottom-color:var(--color-danger)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.err{color:var(--color-danger);font-size:16.5px}
.pickrow{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;padding:4px 2px}
.pickrow::-webkit-scrollbar{display:none}
.pk{flex:none;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:15px;color:var(--color-text-muted);padding:5px;border-radius:var(--radius-md);border:2px solid transparent;min-width:60px}
.pk.on{border-color:var(--color-primary);color:var(--color-text);background:var(--hl)}
.opt{display:flex;align-items:center;gap:12px;padding:8px 4px;border-bottom:1.5px solid var(--rule-line);background:none;text-align:left;width:100%;min-height:56px}
.opt .rad{width:24px;height:24px;border-radius:var(--wobble);border:2px solid var(--pen);flex:none}
.opt.on .rad{background:var(--color-primary);box-shadow:inset 0 0 0 4px var(--color-surface)}
.opt.on b{background:linear-gradient(180deg,transparent 35%,var(--hl) 35% 90%,transparent 90%)}
.opt b{display:inline;font-size:18.5px}
.opt small{display:block;color:var(--color-text-muted);font-size:15px}
.prow{display:flex;align-items:center;gap:10px;padding:6px 2px;min-height:52px}
.prow .nm{flex:1;min-width:0;font-size:17.5px}
.prow .sh{font-family:var(--font-display);font-weight:700;font-size:23px;color:var(--color-text)}
.prow input{width:110px;min-height:44px;border:0;border-bottom:2px solid var(--rule-strong);background:none;padding:0 6px;text-align:right;font-size:19px}
.tog{position:relative;width:28px;height:28px;border-radius:var(--radius-sm);border:2px solid var(--pen);background:var(--color-surface);display:grid;place-items:center;color:transparent;flex:none;overflow:visible;transform:rotate(3deg)}
.tog .ic{position:absolute;width:34px;height:34px;left:2px;top:-12px;stroke-width:2.8}
.tog.on{color:var(--color-primary)}
.status{padding:8px 12px;font-size:16.5px;color:var(--color-text);border-left:3px solid var(--success);background:repeating-linear-gradient(180deg,transparent 0 25px,var(--rule-line) 25px 26px)}
.status.bad{border-left-color:var(--color-danger);color:var(--color-danger)}
.drop{border:2px dashed var(--pen);border-radius:var(--radius-md);padding:20px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px;background:var(--color-surface);position:relative}
.drop input{position:absolute;inset:0;opacity:0;cursor:pointer}
.qa{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.qa button{display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:14px;text-align:left}
.qa b{font-family:var(--font-display);font-weight:700;font-size:28px;line-height:1;color:var(--color-text)}
.qa small{color:var(--color-text-muted);font-size:15px}
.sharebox{white-space:pre-wrap;background:repeating-linear-gradient(180deg,transparent 0 25px,var(--rule-line) 25px 26px),var(--color-surface);border:2px dashed var(--pen);border-radius:var(--radius-md);padding:10px 14px;font-size:16.5px;line-height:26px;max-height:240px;overflow:auto}
.themes{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.thm{display:flex;align-items:center;gap:10px;padding:10px 12px;min-height:56px;border-radius:var(--radius-md);border:2px solid var(--rule-strong);background:var(--color-surface);text-align:left;font-size:17.5px}
.thm.on{border-color:var(--color-primary);background:var(--hl)}
.sw{display:flex}
.sw span{width:22px;height:22px;border-radius:var(--wobble);border:1.5px solid var(--pen)}
.sw span+span{margin-left:-7px}
.recap{position:relative;border-radius:var(--radius-md);background:var(--color-surface);border:2px solid var(--pen);box-shadow:var(--shadow-1);transform:rotate(-.5deg)}
.recap .hd{position:relative;height:170px;border-bottom:2px dashed var(--pen)}
.recap .hd svg{position:absolute;inset:0;width:100%;height:100%}
.recap .hd h3{position:absolute;left:16px;bottom:8px;color:var(--color-text);font-size:40px}
.stats{display:grid;grid-template-columns:repeat(3,1fr)}
.stats div{padding:10px;min-width:0;border-bottom:1.5px solid var(--rule-line)}
.stats b{display:block;font-family:var(--font-display);font-weight:700;font-size:30px;line-height:1;color:var(--color-text);overflow-wrap:anywhere}
.stats small{font-size:14.5px;color:var(--color-text-muted)}

.toast{position:fixed;z-index:60;left:50%;bottom:calc(var(--nav-h) + 24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px) rotate(-1deg);opacity:0;background:var(--color-secondary);color:var(--ink-note);border:2px solid var(--ink-note);padding:10px 18px;border-radius:var(--radius-md);font-size:17px;box-shadow:var(--shadow-1);transition:all .25s;pointer-events:none;max-width:calc(100% - 32px);display:flex;gap:8px;align-items:center}
.toast.show{opacity:1;transform:translate(-50%,0) rotate(-1deg)}
.screen{animation:fade .22s ease}
@keyframes fade{from{opacity:.4;transform:translateY(4px)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.btn:active{transform:none}}

/* Split maths. Amounts are whole paise so totals always add up exactly. */
function shares(e) {
  const out = {};
  if (e.split.type === "custom") { for (const [k, v] of Object.entries(e.split.custom || {})) if (v > 0) out[k] = v; return out; }

  const n = ps.length; if (!n || !(e.amount > 0)) return out;
  const base = Math.floor(e.amount / n); let rem = e.amount - base * n;

  return out;
}

function parseMaps(url) {
  const out = { ok: false, from: "", to: "", stops: [] };

  const host = u.hostname.replace(/^www\./, "");
  out.ok = (/(^|\.)google\.[a-z.]+$/.test(host) && u.pathname.startsWith("/maps")) || host === "maps.app.goo.gl" || (host === "goo.gl" && u.pathname.startsWith("/maps")) || /^maps\.google\./.test(host);

function attention() {
  const net = balances(); const items = []; const ph = tripPhase();
  const unvoted = S.ideas.filter(i => i.status !== "confirmed" && !i.votes.includes(S.me)).length;
  const myOpen = S.tasks.filter(t => !t.done && t.assignee === S.me).length;
  const late = S.tasks.filter(t => !t.done && t.due && t.due < todayISO()).length;
  const toSlot = S.ideas.filter(i => i.status === "shortlisted").length;
  const pollsOpen = S.polls.filter(p => !p.closed && !p.options.some(o => o.votes.includes(S.me))).length;
  const unclaimed = S.kit.filter(k => !k.by).length;
  const over = EXP_CATS.filter(c => S.budget[c] && spentBy(c) > S.budget[c]);
  const toConfirm = S.settlements.filter(x => x.status === "pending" && x.to === S.me);
  if (toConfirm.length) items.push({ icon: "money", text: `${nm(toConfirm[0].from)} says they paid you ${money(toConfirm[0].amount)}${toConfirm.length > 1 ? ` (+${toConfirm.length - 1} more)` : ""}`, a: "confirmFirst" });
  if (S.pot && kittyIn() && kittyLeft() < kittyIn() * .15) items.push({ icon: "money", text: `Kitty is running low · ${money(kittyLeft())} left`, a: "goKitty" });
  if (net[S.me] < 0) items.push({ icon: "money", text: ph.phase === "after" ? `Trip's over. You still owe ${money(-net[S.me])}` : `You owe ${money(-net[S.me])} in total`, a: "goMoneyBal" });
  if (pollsOpen) items.push({ icon: "poll", text: `${pollsOpen} poll${pollsOpen > 1 ? "s" : ""} need your answer`, a: "goIdeas" });
  if (myOpen) items.push({ icon: "tasks", text: `${myOpen} task${myOpen > 1 ? "s" : ""} assigned to you`, a: "goMyTasks" });
  if (unvoted) items.push({ icon: "bulb", text: `${unvoted} idea${unvoted > 1 ? "s" : ""} waiting for your vote`, a: "goIdeas" });
  if (unclaimed) items.push({ icon: "bag", text: `${unclaimed} packing item${unclaimed > 1 ? "s" : ""} nobody's bringing`, a: "goPacking" });
  if (over.length) items.push({ icon: "flag", text: `${CAT[over[0]]}${over.length > 1 ? ` and ${over.length - 1} more` : ""} over budget`, a: "goBudget" });
  if (toSlot) items.push({ icon: "star", text: `${toSlot} shortlisted idea${toSlot > 1 ? "s" : ""} need a time slot`, a: "goIdeas" });
  if (late) items.push({ icon: "clock", text: `${late} task${late > 1 ? "s are" : " is"} past due`, a: "goTasks" });
  return items.slice(0, 5);
}

function drawQR(text) {
  const box = $("#qrBox"); if (!box) return;
  try {
    if (typeof qrcode !== "function") throw 0;
    const qr = qrcode(0, "M"); qr.addData(text); qr.make();
    box.innerHTML = qr.createSvgTag(4, 0);
    const svg = box.querySelector("svg"); if (svg) { svg.setAttribute("width", "100%"); svg.setAttribute("height", "100%"); svg.style.display = "block"; }
  } catch { box.textContent = "The QR code needs an internet connection the first time. Use the app buttons above."; }
}

}

function draftCur() { const el = $("#f-cur"); return el ? el.value : "INR"; }

function updateSplitStatus() {

function saveExpense() {
  const title = $("#f-title").value.trim(); const c = draftCur();
  const raw = parseFloat(String($("#f-amt").value).replace(/[,\s]/g, ""));
  if (!title) return formErr("Add a short description, like \"Dinner\" or \"Fuel\".", "#f-title");
  if (!isFinite(raw) || raw <= 0) return formErr("Enter an amount above 0.", "#f-amt");
  let rate = null;
  if (c !== "INR") { rate = parseFloat($("#f-rate").value); if (!isFinite(rate) || rate <= 0) return formErr(`Enter how many rupees 1 ${c} is worth. Use the rate your group agreed.`, "#f-rate"); }
  const amount = draftAmount();
  if (amount > 100000000) return formErr("That amount looks too large. Check the number.", "#f-amt");
  if (!$("#f-date").value) return formErr("Pick the date of the expense.", "#f-date");
  if (F.split.type !== "custom" && !F.split.participants.length) return formErr("Pick at least one person to share this.");
  if (F.split.type === "custom") {
    const sum = Object.values(F.split.custom).reduce((a, b) => a + (b || 0), 0);
    if (sum !== amount) return formErr(`Custom amounts add up to ${money(sum)}, but the expense is ${money(amount)}.`);
    F.split.participants = Object.keys(F.split.custom).filter(k => F.split.custom[k] > 0);
  } else F.split.custom = {};
  const rec = { id: F.id || uid("e"), title, amount, date: $("#f-date").value, paidBy: F.paidBy, category: F.category, note: $("#f-note").value.trim(), split: clone(F.split) };
  if (c !== "INR") { rec.orig = { cur: c, amt: Math.round(raw * 100) }; rec.rate = rate; S.rates[c] = rate; }
  if (F._o != null) rec._o = F._o;
  if (F.split.type === "group" && F.split.group) rec.split.group = F.split.group;
  const isNew = !F.id; const before = isNew ? null : S.expenses.find(x => x.id === rec.id);
  const changes = before ? expDiff(before, rec) : [];
  if (isNew) logMoney("exp", "add", rec.id, rec.title, rec.amount);
  else if (changes.length) logMoney("exp", "edit", rec.id, rec.title, rec.amount, { changes });
  const shNew = shares(rec);
  if (isNew) Object.keys(shNew).forEach(id => notify([id], `${S.trip.name}: new expense`, `${nmFull(S.me)} added ${rec.title} · ${money(rec.amount)}${rec.paidBy === POT ? " from the kitty" : ""}. Your share: ${money(shNew[id])}.`));
  else if (changes.length) notify([...new Set([...Object.keys(shNew), ...Object.keys(shares(before))])], `${S.trip.name}: expense changed`, `${nmFull(S.me)} changed ${rec.title}: ${changes.join("; ")}.`);
  upsert(S.expenses, rec);
  UI.tab = "money"; UI.money = "exp"; closeSheet(); render();
  const l = S.budget[rec.category], sp = spentBy(rec.category);
  if (l && sp > l) toast(`Saved. ${CAT[rec.category]} is now ${money(sp - l)} over budget.`, "flag");
  else if (l && sp >= l * .8) toast(`Saved. ${CAT[rec.category]} has used ${Math.round(sp / l * 100)}% of its budget.`, "info");
  else toast(isNew ? `${money(amount)} added to the ledger` : "Expense updated. Balances recalculated.");
}

    .sort((a, b) => (b.date || "").localeCompare(a.date || "") || b.ts - a.ts);

    ${inn ? `<div class="bar" style="margin-top:12px"><i class="${low ? "over" : ""}" style="width:${Math.max(0, Math.min(100, Math.round(left / inn * 100)))}%"></i></div>` : ""}
  </div>
  ${low ? `<div class="note warm" style="margin-top:12px">${ic("flag", 18)}<span>The kitty is running low. Collect another round before the next big spend.</span></div>` : ""}
  <div class="two" style="margin-top:14px"><button class="btn" data-a="kittyCollect">${ic("money", 18)} Collect</button><button class="btn ghost" data-a="kittySpend">${ic("receipt", 18)} Spend from it</button></div>

    <div class="card list">${S.members.map(m => `<div class="bal">${av(m.id, 34)}<span class="t"><b>${esc(nm(m.id))}</b>${m.id === h ? `<div class="muted" style="font-size:12.5px;font-weight:600">Holding the cash</div>` : ""}</span><span class="v num ${per[m.id] ? "" : "neg"}">${per[m.id] ? money(per[m.id]) : "Nothing yet"}</span></div>`).join("")}</div></div>

/* ---- Weather from Open-Meteo (free, no key) ---- */
const WX_LABEL = c => c === 0 ? "Clear" : c <= 2 ? "Partly cloudy" : c === 3 ? "Cloudy" : c <= 48 ? "Fog" : c <= 57 ? "Drizzle" : c <= 67 ? "Rain" : c <= 77 ? "Snow" : c <= 82 ? "Showers" : c <= 86 ? "Snow showers" : "Thunderstorms";

function wxData() { const w = UI.wx && UI.wx[S.id]; return w && w.place === wxPlace() ? w : null; }
async function loadWeather(force) {
  if (!S) return;
  const place = wxPlace(); if (!place || wxBusy || !navigator.onLine) return;
  const cur = wxData(); if (!force && cur && Date.now() - cur.at < 3 * 3600000) return;
  loadWeather.tried = loadWeather.tried || {}; if (!force && Date.now() - (loadWeather.tried[S.id] || 0) < 600000) return; loadWeather.tried[S.id] = Date.now();
  const dl = days(); const ahead = (parseDate(dl[0]) - parseDate(todayISO())) / 86400000;
  if (ahead > 15 || (parseDate(dl[dl.length - 1]) - parseDate(todayISO())) / 86400000 < 0) { UI.wx = UI.wx || {}; UI.wx[S.id] = { place, at: Date.now(), days: {}, far: ahead > 15 }; return; }
  wxBusy = true;
  try {
    const tries = [place, place.split(",")[0], place.split(",").slice(-1)[0]].map(x => x.trim()).filter((x, i, a) => x && a.indexOf(x) === i);
    let g = null;
    for (const q of tries) { const r = await fetch(`https://geocoding-api.open-meteo.com/v1/search?count=1&language=en&format=json&name=${encodeURIComponent(q)}`); const j = await r.json(); if (j.results && j.results[0]) { g = j.results[0]; break; } }
    UI.wx = UI.wx || {};
    if (!g) { UI.wx[S.id] = { place, at: Date.now(), days: {}, notFound: true }; return; }
    const s = dl[0] < todayISO() ? todayISO() : dl[0];
    const r = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${g.latitude}&longitude=${g.longitude}&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=auto&start_date=${s}&end_date=${dl[dl.length - 1]}`);
    const j = await r.json(); const out = {};
    (j.daily && j.daily.time || []).forEach((t, i) => out[t] = { c: j.daily.weather_code[i], hi: Math.round(j.daily.temperature_2m_max[i]), lo: Math.round(j.daily.temperature_2m_min[i]), rain: j.daily.precipitation_probability_max[i] || 0 });
    UI.wx[S.id] = { place, at: Date.now(), days: out, name: g.name + (g.admin1 ? ", " + g.admin1 : "") };
    save(); render(true);
  } catch { /* offline or blocked: try again later */ }
  finally { wxBusy = false; }
}
function wxLine(iso, big) {
  const w = wxData(); if (!w) return "";
  const d = w.days[iso];
  if (!d) {
    if (w.notFound) return `<div class="note" style="margin-top:12px">${ic("cloud", 18)}<span>Couldn't find weather for "${esc(wxPlace())}". <button class="link-btn" data-a="tripSettings">Set a nearby town</button></span></div>`;
    if (w.far && big) return `<div class="note" style="margin-top:12px">${ic("cloud", 18)}<span>The forecast shows up here about two weeks before the trip.</span></div>`;
    return "";
  }
  const tip = d.rain >= 60 ? " Carry umbrellas or rain jackets." : d.hi >= 35 ? " It'll be hot. Carry water and caps." : d.lo <= 8 ? " Cold night. Pack warm layers." : "";
  return `<div class="note wx" style="margin-top:12px">${ic(WX_ICON(d.c, d.rain), 20)}<span><b>${WX_LABEL(d.c)} · ${d.lo}–${d.hi}°C</b>${d.rain ? ` · ${d.rain}% chance of rain` : ""}${tip ? `<br>${tip.trim()}` : ""}<br><small class="muted">${esc(w.name || wxPlace())} · Open-Meteo forecast</small></span></div>`;
}

/* ---- Receipt reading on the phone (Tesseract.js) ---- */
let tessP = null;
const loadTess = () => tessP || (tessP = new Promise((res, rej) => { const s = document.createElement("script"); s.src = "https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"; s.onload = () => res(window.Tesseract); s.onerror = () => { tessP = null; rej(new Error("load")); }; document.head.appendChild(s); }));
async function readReceipt(dataUrl) {
  const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = dataUrl; });
  const k = Math.min(1, 1600 / Math.max(img.width, img.height)); const c = document.createElement("canvas");

  const x = c.getContext("2d"); x.filter = "grayscale(1) contrast(1.3)"; x.drawImage(img, 0, 0, c.width, c.height);
  const T = await loadTess();

}
function parseReceipt(text) {
  const lines = text.split(/\n/).map(l => l.trim()).filter(Boolean);
  const nums = l => (l.match(/\d{1,3}(?:,\d{2,3})+(?:\.\d{1,2})?|\d+\.\d{1,2}|\d+/g) || []).map(n => parseFloat(n.replace(/,/g, ""))).filter(n => isFinite(n));
  let total = 0, how = "";
  const pick = re => { for (let i = lines.length - 1; i >= 0; i--) { if (re.test(lines[i]) && !/sub\s*-?\s*total/i.test(lines[i])) { const n = nums(lines[i]).filter(v => v > 0 && v < 1e7); if (n.length) return n[n.length - 1]; } } return 0; };
  total = pick(/grand\s*total|net\s*(amount|payable|total)|amount\s*(payable|due)|total\s*(amount|payable|due|rs|inr|₹)|bill\s*amount/i); if (total) how = "grand total";
  if (!total) { total = pick(/\btotal\b|\bamount\b/i); if (total) how = "total"; }
  if (!total) { const d = lines.flatMap(l => /phone|ph\.|gst|tin|mob|tel|invoice|bill\s*no/i.test(l) ? [] : (l.match(/\d+\.\d{2}\b/g) || []).map(Number)); if (d.length) { total = Math.max(...d); how = "largest amount"; } }
  let date = "";
  const dm = text.match(/\b(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})\b/);
  if (dm) { let [_, dd, mm, yy] = dm; yy = yy.length === 2 ? "20" + yy : yy; const iso = `${yy}-${pad(+mm)}-${pad(+dd)}`; if (+mm >= 1 && +mm <= 12 && +dd >= 1 && +dd <= 31 && +yy >= 2020 && +yy <= 2100) date = iso; }
  const nameLine = lines.find(l => (l.match(/[A-Za-z]/g) || []).length >= 4 && !/invoice|receipt|bill|gst|tax|tin|date|cash|phone|ph\b|tel|www|@/i.test(l)) || "";
  const title = nameLine.replace(/[^A-Za-z0-9&'.\- ]/g, " ").replace(/\s+/g, " ").trim().slice(0, 40).toLowerCase().replace(/\b\w/g, c => c.toUpperCase());
  const t = text.toLowerCase();
  const category = /petrol|diesel|fuel|hpcl|bpcl|indian oil|iocl|shell|nayara/.test(t) ? "fuel" : /toll|fastag|parking|cab|taxi|uber|ola\b|bus|railway|irctc/.test(t) ? "transport" : /mart|super ?market|grocer|kirana|provision|dmart|reliance fresh|more\b/.test(t) ? "groceries" : /restaurant|cafe|café|kitchen|dhaba|biryani|food|bar\b|bakery|meals|veg|chicken|paneer|coffee|tea\b|curry|roti|naan|thali|dosa|idli|biriyani|juice/.test(t) ? "food" : /resort|homestay|lodge|stay|room|check-?in/.test(t) ? "stay" : /ticket|entry|admission|safari|rafting/.test(t) ? "activity" : "";
  return { total: Math.round(total * 100), how, date, title, category };
}

  }));
}

/* ---- Start a new trip from an old one ---- */
function copyFromTrip(T, src, opts) {
  if (opts.people) { T.members = clone(src.members); const me = src.members.find(m => m.id === src.me); if (me) { T.me = me.id; const mine = T.members.find(m => m.id === me.id); if (mine && opts.myName) mine.name = opts.myName; } }
  if (opts.kit) T.kit = src.kit.map(k => ({ id: uid("k"), name: k.name, by: opts.people && T.members.some(m => m.id === k.by) ? k.by : "", packed: false }));
  if (opts.tasks) T.tasks = src.tasks.map(t => ({ id: uid("t"), title: t.title, notes: t.notes || "", assignee: opts.people && T.members.some(m => m.id === t.assignee) ? t.assignee : "", createdBy: T.me, due: "", priority: t.priority || "normal", done: false }));
  if (opts.people && src.groups) T.groups = clone(src.groups);
  if (opts.budget) T.budget = clone(src.budget || {});
  let o = 1; SYNCED.forEach(k => (T[k] || []).forEach(x => x._o = o++));
  return T;
}

    <div class="eyebrow">Recent expenses</div><div class="card list">${[...S.expenses].sort((a, b) => b.date.localeCompare(a.date)).slice(0, 5).map(e => `<button class="exp" data-a="shareRef" data-k="expense" data-id="${e.id}">${ill(e.category, 40)}<span class="t"><b>${esc(e.title)}</b><small>${money(e.amount)}</small></span>${ic("send", 16)}</button>`).join("") || `<p class="calc" style="padding:12px">No expenses yet</p>`}</div></div>`),
  tripsSheet: () => { closeIfOpen(); tripsSheet(); }, newTripSheet: () => { closeIfOpen(); newTripSheet(); },
  openTrip: d => switchTrip(d.id),
  addDemo: () => { const T = seed(); STORE.trips[T.id] = T; switchTrip(T.id); toast("Demo trip added. Have a look around."); },
  delTrip: (d, el) => { if (!confirmTap(el, "Tap again to remove")) return; const name = S.trip.name; closeSheet(); deleteTrip(S.id); toast(`Removed ${name} from your phone`); },
  payNow: d => { closeIfOpen(); paySheet(d.to, +d.amt); },
  iPaid: d => { const sr = { id: uid("s"), from: S.me, to: d.to, amount: +d.amt, date: todayISO(), method: "UPI", note: "", status: "pending", by: S.me }; S.settlements.push(sr);
    logMoney("pay", "add", sr.id, `${nmFull(S.me)} → ${nmFull(d.to)} payment`, +d.amt); notify([d.to], `${S.trip.name}: payment to confirm`, `${nmFull(S.me)} says they paid you ${money(+d.amt)} by UPI. Check your bank and confirm in Let's Go.`); postMsg({ text: `I've paid ${nmFull(d.to)} ${money(+d.amt)} by UPI. Please confirm in Money when it arrives.` }); closeSheet(); render(); toast(`Marked as paid. ${nmFull(d.to)} will confirm.`); },
  confirmSheet: d => { closeIfOpen(); confirmSheet(d.id); },
  confirmFirst: () => { const p = S.settlements.find(x => x.status === "pending" && x.to === S.me); if (p) confirmSheet(p.id); },
  confirmPay: d => { const p = S.settlements.find(x => x.id === d.id); if (!p) return; p.status = "confirmed"; p.confirmedOn = todayISO();
    logMoney("pay", "confirm", p.id, `${nmFull(p.from)} → ${nmFull(p.to)} payment`, p.amount); notify([p.from], `${S.trip.name}: payment confirmed`, `${nmFull(S.me)} confirmed your ${money(p.amount)} payment.`); closeSheet(); render(); toast(`Confirmed ${money(p.amount)} from ${nmFull(p.from)}. Balances updated.`); },
  rejectPay: (d, el) => { if (!confirmTap(el, "Tap again: not received")) return; const p = S.settlements.find(x => x.id === d.id); if (!p) return; S.settlements = S.settlements.filter(x => x.id !== d.id); postMsg({ text: `${nmFull(S.me)} hasn't received the ${money(p.amount)} from ${nmFull(p.from)} yet. Could you check?` }); closeSheet(); render(); toast("Marked as not received. A note was posted in chat.", "info"); },
  copyAmt: d => copyText((+d.v / 100).toFixed(2), "Amount copied")
};

Object.assign(A, {
  kittySetup: () => { closeIfOpen(); kittySetup(); },
  kittyCollect: () => { closeIfOpen(); if (!S.pot) return kittySetup(); kittyCollect(); },
  kittyAdd: () => { closeIfOpen(); kittyAdd(); },
  kittySpend: () => { closeIfOpen(); openExpense(null, "manual", { paidBy: POT }); },
  kittyEnd: (d, el) => { if (kittyLeft() !== 0) { toast(`The kitty still has ${money(kittyLeft())}. Refund it or spend it first.`, "info"); return; } if (!confirmTap(el, "Tap again to end")) return; S.pot = null; closeSheet(); render(); toast("Kitty ended. Its records stay in the history."); },
  kittyAsk: () => { const h = kittyHolder(); const a = toPaise(($("#f-each") || {}).value || 0) || (S.pot && S.pot.per) || 0;
    const n = notify(F.picked || S.members.map(m => m.id), `Trip kitty: ${S.trip.name}`, `${nmFull(S.me)} is collecting ${a ? money(a) + " each" : "money"} for the trip kitty. Please hand it to ${h === S.me ? nmFull(S.me) : nmFull(h)}.`);
    toast(n ? `Asked ${n} ${n === 1 ? "person" : "people"} with notifications on` : "Nobody has notifications on yet", n ? "bell" : "info"); },
  colPick: d => { const p = F.picked; const k = p.indexOf(d.id); if (k >= 0) p.splice(k, 1); else p.push(d.id); const el = document.querySelector(`[data-a=colPick][data-id="${d.id}"]`); if (el) { el.classList.toggle("on", k < 0); el.setAttribute("aria-pressed", String(k < 0)); } },
  delKitty: (d, el) => { if (!confirmTap(el, "Sure?")) return; const r = S.kitty.find(x => x.id === d.id); if (!r) return; S.kitty = S.kitty.filter(x => x.id !== d.id); logMoney("kitty", "delete", r.id, r.kind === "in" ? `${nmFull(r.from)}'s kitty money` : `Kitty refund to ${nmFull(r.to)}`, r.amount, { snap: r }); render(); toast("Removed"); },
  history: () => { closeIfOpen(); historySheet(); },
  restoreExp: d => { const h = S.log.find(x => x.id === d.id); if (!h || !h.snap) return; if (S.expenses.some(e => e.id === h.ref)) { toast("That expense is already back.", "info"); return; }
    S.expenses.push(clone(h.snap)); logMoney("exp", "restore", h.ref, h.snap.title, h.snap.amount); closeSheet(); render(); toast(`${h.snap.title} is back. Balances recalculated.`); },
  ntOn: () => { const m = mem(S.me); if (!m) return; const a = new Uint8Array(12); crypto.getRandomValues(a); m.ntfy = "letsgo-" + [...a].map(x => "abcdefghjkmnpqrstuvwxyz23456789"[x % 31]).join("");
    save(); closeIfOpen(); tripSettings(); toast("Turned on. Follow the 3 steps to finish.", "bell"); setTimeout(() => { const el = document.querySelector("[data-a=ntTest]"); if (el) el.scrollIntoView({ block: "center" }); }, 350); },
  ntOff: () => { const m = mem(S.me); if (m) delete m.ntfy; save(); closeIfOpen(); tripSettings(); toast("Notifications off for this trip", "x"); },
  ntCopy: () => { const m = mem(S.me); if (m && m.ntfy) copyText(m.ntfy, "Topic copied"); },
  ntTest: () => { const m = mem(S.me); if (!m || !m.ntfy) return;
    fetch(NTFY + "/", { method: "POST", body: JSON.stringify({ topic: m.ntfy, title: "Let's Go is connected", message: `You'll get updates for ${S.trip.name} here.`, tags: ["tada"] }) })
      .then(r => toast(r.ok ? "Test sent. Check the ntfy app." : "ntfy didn't accept it. Try again in a minute.", r.ok ? "bell" : "info")).catch(() => toast("Couldn't reach ntfy. Check your connection.", "info")); scheduleReminders(); },
  nudgePush: d => { const n = notify([d.from], `Settle up: ${S.trip.name}`, `${nmFull(S.me)} is reminding you: you owe ${nmFull(d.to)} ${money(+d.amt)}. Open Let's Go to pay by UPI.`); closeSheet(); toast(n ? "Reminder sent" : `${nmFull(d.from)} hasn't turned on notifications`, n ? "bell" : "info"); },
  groups: () => { closeIfOpen(); groupsSheet(); },
  editGroup: d => { editGroup(d.id, d.k); },
  delGroup: (d, el) => { if (!confirmTap(el, "Tap again to remove")) return; const k = d.k === "car" ? "cars" : "rooms"; S.groups[k] = S.groups[k].filter(g => g.id !== d.id); save(); groupsSheet(); toast("Removed"); },
  grpPick: d => { const p = F.picked; const k = p.indexOf(d.id); if (k >= 0) p.splice(k, 1); else p.push(d.id); const el = document.querySelector(`[data-a=grpPick][data-id="${d.id}"]`); if (el) { el.classList.toggle("on", k < 0); el.setAttribute("aria-pressed", String(k < 0)); } },
  expGroup: d => { const g = groupOf(d.id); if (!g) return; F.split.group = g.id; F.split.participants = S.members.map(m => m.id).filter(id => g.members.includes(id)); renderSplitBox(); },
  essentials: () => { closeIfOpen(); essentialsSheet(); },
  editEssentials: () => { closeIfOpen(); editEssentials(); },
  essAddContact: () => { document.querySelectorAll("#essContacts [data-c]").forEach(el => { F.contacts[+el.dataset.c][el.dataset.f] = el.value.trim(); }); F.contacts.push({ name: "", phone: "", note: "" }); $("#essContacts").innerHTML = F.contacts.map(F.crow).join(""); const ins = document.querySelectorAll("#essContacts [data-f=name]"); if (ins.length) ins[ins.length - 1].focus(); },
  wxRefresh: () => loadWeather(true)
});
function copyText(t, ok, selectSel) {
  const fallback = () => { const el = selectSel && $(selectSel); if (el) { if (el.select) el.select(); else { const r = document.createRange(); r.selectNodeContents(el); const s = getSelection(); s.removeAllRanges(); s.addRange(r); } toast("Selected. Use Copy from the menu.", "info"); } else toast("Couldn't copy. Long-press to copy instead.", "info"); };
  try { navigator.clipboard.writeText(t).then(() => toast(ok), fallback); } catch { fallback(); }
}

document.addEventListener("click", ev => {
  const el = ev.target.closest("[data-a]"); if (!el) return;
  const fn = A[el.dataset.a]; if (!fn) return;
  ev.preventDefault(); fn(el.dataset, el);
});
document.addEventListener("input", ev => {
  const t = ev.target;
  if ((t.id === "f-amt" || t.id === "f-rate") && $("#expForm")) updateSplitStatus();
  if (t.classList.contains("custom-in")) { const v = toPaise(t.value); F.split.custom[t.dataset.id] = isNaN(v) ? 0 : Math.max(0, v); updateSplitStatus(); }
});
document.addEventListener("submit", ev => {
  if (ev.target.id === "chatForm") {
    ev.preventDefault();
    const inp = $("#chatIn"); const text = inp.value.trim(); if (!text) return;
    inp.value = ""; postMsg({ text }); render(); setTimeout(() => { const c = $("#chatIn"); if (c) c.focus(); }, 50);
  }
  if (ev.target.id === "kitForm") {
    ev.preventDefault();
    const n = $("#kitIn").value.trim(); if (!n) return;
    if (S.kit.some(k => k.name.toLowerCase() === n.toLowerCase())) { toast(`${n} is already on the list`, "info"); return; }
    S.kit.push({ id: uid("k"), name: n, by: "", packed: false }); render(); setTimeout(() => { const k = $("#kitIn"); if (k) k.focus(); }, 50); toast("Added. Anyone can claim it.");
  }
});

applyTheme();
render();
initSync();
if ("serviceWorker" in navigator && location.protocol === "https:") {
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}
</script>
</body>
</html>
