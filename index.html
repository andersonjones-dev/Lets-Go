<!doctype html>
<html lang="en-IN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Let's Go</title>
<meta name="description" content="Plan group trips with friends: vote on ideas, share tasks, split expenses and settle up.">
<meta name="theme-color" content="#FAF7F0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Let's Go">
<meta name="application-name" content="Let's Go">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: one phone-width column (max 480px), sticky screen header, scrolling body, fixed five-tab bar.
   Single light look by design: warm ivory ground, evergreen brand, coral/lavender/yellow/sky accents. */
:root{
  --ever:#064E43; --ever-2:#0B6B5C; --teal:#103D38;
  --ivory:#FAF7F0; --cream:#F2ECDF; --card:#FFFDF8; --line:#E6DFD0;
  --lav:#6E67C4; --lav-soft:#ECEAFB; --coral:#F28C72; --coral-deep:#C9563C; --coral-soft:#FDE7DF;
  --yellow:#F3C96B; --yellow-soft:#FCF1D6; --green-soft:#DCEBDD; --sky:#8FC7E0; --sky-soft:#E3F2F8;
  --ink:#15261F; --muted:#626A60; --danger:#B83A32; --ok:#2E7D5B;
  --font-d:"Bricolage Grotesque","Avenir Next",system-ui,sans-serif;
  --font-b:"Figtree",-apple-system,"Segoe UI",system-ui,sans-serif;
  --r-xl:26px; --r-lg:20px; --r-md:16px; --r-sm:12px;
  --shadow:0 1px 2px rgba(16,61,56,.06),0 10px 24px -14px rgba(16,61,56,.22);
  --nav-h:68px;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{background:var(--ivory);color:var(--ink)}
body{font-family:var(--font-b);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--ivory)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,select,textarea{font:inherit;color:var(--ink)}
a{color:inherit}
:focus-visible{outline:3px solid var(--yellow);outline-offset:2px;border-radius:10px}
.app{max-width:480px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(var(--nav-h) + 40px + env(safe-area-inset-bottom,0px))}
.app.chatmode{padding-block-end:calc(var(--nav-h) + 92px + env(safe-area-inset-bottom,0px))}
.ic{flex:none;display:block}
h1,h2,h3{font-family:var(--font-d);margin:0;text-wrap:balance;letter-spacing:-.01em}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}

/* Top bar */
.topbar{box-shadow:0 0 0 100vmax var(--ivory);clip-path:inset(0 -100vmax);position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--ivory);display:flex;align-items:center;gap:10px;padding-block:14px 10px}
.topbar h1{font-size:27px;font-weight:800;color:var(--teal);flex:1;min-width:0}
.iconbtn{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:var(--teal);background:var(--card);border:1px solid var(--line)}
.iconbtn.solid{background:var(--ever);color:#fff;border-color:var(--ever)}
.brand{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.logo{width:44px;height:44px;border-radius:14px;background:var(--ever);display:grid;place-items:center;flex:none}
.brand b{font-family:var(--font-d);font-size:26px;font-weight:800;color:var(--teal);line-height:1;display:block}
.brand small{font-size:12.5px;color:var(--muted)}

/* Bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:25;background:rgba(255,253,248,.96);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.nav-in{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);height:var(--nav-h)}
.nav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11.5px;font-weight:600;color:#7C8279}
.nav .pill{width:52px;height:30px;border-radius:15px;display:grid;place-items:center;transition:background .2s}
.nav button[aria-current="page"]{color:var(--ever)}
.nav button[aria-current="page"] .pill{background:var(--green-soft)}

/* Shared pieces */
.seg{display:flex;background:var(--cream);border-radius:999px;padding:4px;gap:4px}
.seg button{flex:1;height:38px;border-radius:999px;font-weight:600;font-size:14px;color:var(--muted);white-space:nowrap}
.seg button.on{background:var(--ever);color:#fff;box-shadow:0 4px 10px -4px rgba(6,78,67,.5)}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-block:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:34px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:13.5px;font-weight:600;color:var(--muted)}
.chip.on{background:var(--teal);border-color:var(--teal);color:#fff}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:50px;padding:0 22px;border-radius:999px;font-weight:700;font-size:15.5px;background:var(--ever);color:#fff;text-decoration:none}
.btn:active{transform:scale(.98)}
.btn.block{width:100%}
.btn.soft{background:var(--green-soft);color:var(--ever)}
.btn.ghost{background:var(--card);color:var(--teal);border:1.5px solid var(--line)}
.btn.coral{background:var(--coral);color:#3A140B}
.btn.danger{background:var(--coral-soft);color:var(--danger)}
.btn.sm{height:38px;padding:0 14px;font-size:13.5px}
.btn[disabled]{opacity:.45;pointer-events:none}
.row{display:flex;align-items:center;gap:10px}
.stack{display:flex;flex-direction:column;gap:12px}
.section{display:flex;flex-direction:column;gap:12px;margin-top:22px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.sec-h h2{font-size:19px;font-weight:700;color:var(--teal)}
.link-btn{font-size:13.5px;font-weight:700;color:var(--ever)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow)}
.pillt{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 9px;border-radius:999px;font-size:11.5px;font-weight:700;letter-spacing:.02em}
.p-prop{background:var(--sky-soft);color:#235F7A}
.p-short{background:var(--yellow-soft);color:#7A5410}
.p-conf{background:var(--green-soft);color:var(--ever)}
.p-high{background:var(--coral-soft);color:var(--coral-deep)}
.p-demo{background:rgba(255,255,255,.85);color:var(--teal)}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

/* Avatars */
.av{flex:none;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-family:var(--font-d);box-shadow:0 0 0 2px var(--card)}
.avs{display:flex;align-items:center}
.avs .av+.av{margin-left:-8px}
.avs .more{margin-left:-8px;background:var(--cream);color:var(--teal);font-size:11px}

/* Illustrations */
.ill{flex:none;border-radius:16px;display:grid;place-items:center;overflow:hidden}
.ill svg{width:78%;height:78%}

/* Trip */
.cover{position:relative;border-radius:var(--r-xl);overflow:hidden;aspect-ratio:16/10;max-width:100%;box-shadow:var(--shadow)}
.cover svg.scene{position:absolute;inset:0;width:100%;height:100%}
.cover::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(16,61,56,0) 40%,rgba(16,61,56,.72))}
.cover .over{position:absolute;inset:auto 0 0 0;z-index:2;padding:18px;display:flex;flex-direction:column;gap:10px}
.cover h2{color:#fff;font-size:32px;font-weight:800;line-height:1.02;text-shadow:0 2px 12px rgba(0,0,0,.18)}
.cover .demo{position:absolute;top:14px;left:14px;z-index:2}
.going{display:inline-flex;align-items:center;gap:8px;background:rgba(255,253,248,.92);border-radius:999px;padding:4px 6px 4px 12px;font-weight:700;font-size:13px;color:var(--teal)}
.meta{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:14px;color:var(--muted);font-weight:600;padding-inline:4px}
.meta span{display:inline-flex;align-items:center;gap:6px}
.attn{border-radius:var(--r-xl);padding:18px;color:#fff;background:radial-gradient(120% 90% at 100% 0%,#8D86DE 0%,rgba(141,134,222,0) 60%),linear-gradient(160deg,#5C55B4,#3E3891);box-shadow:0 14px 30px -16px rgba(62,56,145,.7)}
.attn h3{font-size:18px;font-weight:700;display:flex;align-items:center;justify-content:space-between;gap:8px}
.attn .count{width:28px;height:28px;border-radius:50%;background:#fff;color:#3E3891;display:grid;place-items:center;font-size:14px}
.attn ul{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-direction:column}
.attn li button{width:100%;display:flex;align-items:center;gap:12px;padding:11px 2px;border-top:1px solid rgba(255,255,255,.16);text-align:left;font-weight:600;font-size:14.5px;color:#fff}
.attn .dot{width:32px;height:32px;border-radius:10px;background:rgba(255,255,255,.14);display:grid;place-items:center;flex:none}
.attn .go{margin-left:auto;opacity:.75}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{display:flex;align-items:center;gap:12px;padding:12px;text-align:left;border-radius:var(--r-lg)}
.tile b{display:block;font-family:var(--font-d);font-size:16px;color:var(--teal)}
.tile small{color:var(--muted);font-weight:600;font-size:12.5px}
.next{display:flex;gap:12px;align-items:center;padding:10px;text-align:left;width:100%}
.next .t{flex:1;min-width:0}
.next b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.next small{color:var(--muted);font-weight:600;font-size:12.5px}
.fab{position:fixed;z-index:24;right:max(18px,calc(50% - 222px));bottom:calc(var(--nav-h) + 16px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:20px;background:var(--coral);color:#3A140B;display:grid;place-items:center;box-shadow:0 12px 24px -10px rgba(201,86,60,.7)}

/* Plan */
.days{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(92px,1fr);gap:8px;overflow-x:auto;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.day{border-radius:var(--r-md);padding:9px 10px;background:var(--cream);text-align:center;font-weight:700;color:var(--teal);font-size:14.5px}
.day small{display:block;font-weight:600;font-size:12px;color:var(--muted)}
.day.on{background:var(--teal);color:#fff}
.day.on small{color:rgba(255,255,255,.75)}
.tl{display:flex;flex-direction:column;gap:12px}
.tl-item{display:grid;grid-template-columns:56px 1fr;gap:10px;align-items:start}
.tl-time{font-weight:700;font-size:13px;color:var(--teal);padding-top:14px;text-align:right}
.tl-time small{display:block;color:var(--muted);font-weight:600;font-size:11.5px}
.act{display:flex;gap:12px;padding:10px;align-items:center;min-width:0}
.act .t{flex:1;min-width:0}
.act-main{display:flex;gap:12px;align-items:center;flex:1;min-width:0;text-align:left}
.act b{display:block;font-size:15.5px;line-height:1.25}
.act .sub{font-size:12.5px;color:var(--muted);font-weight:600;margin-top:2px}
.act .foot{display:flex;align-items:center;gap:8px;margin-top:7px}
.mv{display:flex;flex-direction:column;gap:4px}
.mv button{width:30px;height:28px;border-radius:9px;background:var(--cream);display:grid;place-items:center;color:var(--teal)}
.mv button[disabled]{opacity:.3}
.idea{padding:12px;display:flex;gap:12px}
.idea .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.idea b{font-family:var(--font-d);font-size:17px;color:var(--teal);line-height:1.2}
.idea p{margin:0;font-size:13.5px;color:var(--muted)}
.idea .foot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:6px}
.vote{height:36px;padding:0 14px;border-radius:999px;background:var(--ever);color:#fff;font-weight:700;font-size:13.5px;display:inline-flex;align-items:center;gap:6px}
.vote.on{background:var(--green-soft);color:var(--ever)}
.votes-n{font-size:12.5px;font-weight:700;color:var(--muted)}
.linkcard{display:flex;gap:12px;padding:10px;align-items:center}
.linkcard .t{flex:1;min-width:0}
.linkcard b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.linkcard small{display:block;color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.note{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:var(--r-md);background:var(--sky-soft);color:#1E4E63;font-size:13.5px;font-weight:500}
.note.warm{background:var(--yellow-soft);color:#6B4A0E}
.empty{text-align:center;padding:26px 18px;display:flex;flex-direction:column;align-items:center;gap:10px}
.empty b{font-family:var(--font-d);font-size:18px;color:var(--teal)}
.empty p{margin:0;color:var(--muted);font-size:14px;max-width:30ch}

/* Tasks */
.progress{padding:16px;display:flex;gap:14px;align-items:center}
.bar{height:10px;border-radius:999px;background:var(--cream);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--ever-2),#3FA27F);transition:width .4s}
.task{display:flex;align-items:center;gap:12px;padding:12px}
.task .t{flex:1;min-width:0;text-align:left}
.task b{display:block;font-size:15.5px;font-weight:600}
.task .desc{font-size:13px;color:var(--muted);margin-top:1px}
.task .foot{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin-top:6px;font-size:12.5px;font-weight:600;color:var(--muted)}
.task.done b{text-decoration:line-through;color:var(--muted)}
.chk{width:30px;height:30px;border-radius:50%;border:2px solid #BDB6A6;display:grid;place-items:center;flex:none;color:transparent;transition:all .2s}
.chk.on{background:var(--ever);border-color:var(--ever);color:#fff}
.chk.pop{animation:pop .35s ease}
@keyframes pop{50%{transform:scale(1.18)}}
.due{display:inline-flex;align-items:center;gap:4px}
.due.late{color:var(--danger)}
.list{display:flex;flex-direction:column}
.list>*+*{border-top:1px solid var(--line)}

/* Money */
.total{border-radius:var(--r-xl);padding:18px;color:#fff;background:radial-gradient(120% 120% at 100% 0%,#1A7A68 0%,rgba(26,122,104,0) 55%),linear-gradient(160deg,#0A5A4D,#0B3B35);position:relative;overflow:hidden}
.total .lbl{font-size:13.5px;font-weight:600;opacity:.85}
.total .big{font-family:var(--font-d);font-size:38px;font-weight:800;line-height:1.1;margin-top:2px}
.total .wallet{position:absolute;right:10px;top:10px;width:96px;height:96px}
.mini3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.mini3 div{background:rgba(255,255,255,.1);border-radius:14px;padding:9px 10px}
.mini3 small{display:block;font-size:11.5px;opacity:.8;font-weight:600}
.mini3 b{font-size:15px}
.exp{display:flex;align-items:center;gap:12px;padding:12px;width:100%;text-align:left}
.exp .t{flex:1;min-width:0}
.exp b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.exp small{display:block;color:var(--muted);font-size:12.5px;font-weight:600}
.exp .amt{text-align:right;font-weight:700;font-size:15.5px}
.exp .amt small{font-weight:600}
.bal{display:flex;align-items:center;gap:12px;padding:12px}
.bal .t{flex:1;min-width:0}
.bal .v{font-weight:800;font-family:var(--font-d);font-size:17px}
.pos{color:var(--ok)} .neg{color:var(--coral-deep)}
.xfer{padding:14px;display:flex;flex-direction:column;gap:12px}
.xfer .who{display:flex;align-items:center;gap:8px;font-weight:600}
.xfer .amt{font-family:var(--font-d);font-size:22px;font-weight:800;color:var(--teal);margin-left:auto}
.xfer .acts{display:flex;flex-wrap:wrap;gap:8px}
.calc{font-size:13.5px;color:var(--muted);line-height:1.55}
.calc b{color:var(--ink)}

/* Chat */
.msgs{display:flex;flex-direction:column;gap:12px;padding-top:6px}
.msg{display:flex;gap:8px;align-items:flex-end;max-width:86%}
.msg.me{align-self:flex-end;flex-direction:row-reverse}
.bub{background:var(--card);border:1px solid var(--line);border-radius:18px 18px 18px 6px;padding:9px 12px;min-width:0;overflow-wrap:anywhere}
.msg.me .bub{background:var(--ever);color:#fff;border-color:var(--ever);border-radius:18px 18px 6px 18px}
.bub .nm{font-size:12px;font-weight:700;margin-bottom:2px}
.bub .ts{font-size:11px;opacity:.65;text-align:right;margin-top:3px}
.bub a{color:inherit;font-weight:600}
.refcard{display:flex;gap:10px;align-items:center;margin-top:6px;padding:8px;border-radius:14px;background:var(--ivory);color:var(--ink);text-align:left;width:100%}
.msg.me .refcard{background:rgba(255,255,255,.95)}
.refcard b{display:block;font-size:13.5px}
.refcard small{display:block;font-size:12px;color:var(--muted)}
.composer{position:fixed;left:0;right:0;z-index:24;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px));background:var(--ivory);border-top:1px solid var(--line);padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));padding-block:10px}
.composer form{max-width:480px;margin:0 auto;display:flex;gap:8px;align-items:center}
.composer input{flex:1;min-width:0;height:46px;border-radius:999px;border:1px solid var(--line);background:var(--card);padding:0 16px;font-size:16px}
.tripbar{display:flex;align-items:center;gap:10px;padding:10px 12px;width:100%;text-align:left}
.tripbar b{display:block;font-size:14px}
.tripbar small{color:var(--muted);font-size:12px;font-weight:600}

/* Sheet */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(16,40,34,.42);opacity:0;transition:opacity .2s}
.scrim.show{opacity:1}
.sheet{position:fixed;z-index:41;left:0;right:0;bottom:0;margin:0 auto;max-width:480px;max-height:92dvh;overflow-y:auto;overscroll-behavior:contain;background:var(--ivory);border-radius:26px 26px 0 0;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));padding-block:8px calc(24px + env(safe-area-inset-bottom,0px));transform:translateY(100%);transition:transform .28s cubic-bezier(.2,.8,.2,1)}
.sheet.show{transform:none}
.grab{width:40px;height:5px;border-radius:3px;background:#D7CFBE;margin:4px auto 10px}
.sheet-h{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.sheet-h h2{flex:1;font-size:22px;font-weight:800;color:var(--teal)}
.field{display:flex;flex-direction:column;gap:6px}
.field label,.flabel{font-size:13px;font-weight:700;color:var(--teal)}
.inp{height:48px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);padding:0 14px;font-size:16px;width:100%}
textarea.inp{height:auto;min-height:76px;padding:12px 14px;resize:vertical}
.inp:focus{border-color:var(--ever-2);outline:none}
.inp.bad{border-color:var(--danger)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.err{color:var(--danger);font-size:13px;font-weight:600}
.pickrow{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;padding:4px 2px}
.pickrow::-webkit-scrollbar{display:none}
.pk{flex:none;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:12px;font-weight:600;color:var(--muted);padding:4px;border-radius:16px;border:2px solid transparent}
.pk.on{border-color:var(--ever);color:var(--ever);background:var(--card)}
.opt{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:var(--r-md);border:1.5px solid var(--line);background:var(--card);text-align:left;width:100%}
.opt .rad{width:22px;height:22px;border-radius:50%;border:2px solid #BDB6A6;flex:none;display:grid;place-items:center}
.opt.on{border-color:var(--ever)}
.opt.on .rad{border-color:var(--ever);background:var(--ever);box-shadow:inset 0 0 0 4px var(--card)}
.opt b{display:block;font-size:15px}
.opt small{color:var(--muted);font-size:12.5px}
.prow{display:flex;align-items:center;gap:10px;padding:9px 2px}
.prow .nm{flex:1;font-weight:600}
.prow .sh{font-weight:700;color:var(--teal)}
.prow input{width:110px;height:40px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);padding:0 10px;text-align:right;font-size:16px}
.tog{width:28px;height:28px;border-radius:9px;border:2px solid #BDB6A6;display:grid;place-items:center;color:transparent;flex:none}
.tog.on{background:var(--ever);border-color:var(--ever);color:#fff}
.status{padding:10px 12px;border-radius:12px;font-size:13.5px;font-weight:600}
.status.ok{background:var(--green-soft);color:var(--ever)}
.status.bad{background:var(--coral-soft);color:var(--danger)}
.drop{border:2px dashed #CFC6B3;border-radius:var(--r-lg);padding:20px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px;background:var(--card);position:relative}
.drop input{position:absolute;inset:0;opacity:0;cursor:pointer}
.drop img{max-height:200px;border-radius:12px}
.qa{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.qa button{display:flex;flex-direction:column;align-items:flex-start;gap:10px;padding:14px;border-radius:var(--r-lg);text-align:left}
.qa b{font-family:var(--font-d);font-size:17px;color:var(--teal)}
.qa small{color:var(--muted);font-size:12.5px;font-weight:600}
.sharebox{white-space:pre-wrap;background:var(--card);border:1px solid var(--line);border-radius:var(--r-md);padding:12px 14px;font-size:13.5px;max-height:220px;overflow:auto}

.toast{position:fixed;z-index:60;left:50%;bottom:calc(var(--nav-h) + 24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;background:var(--teal);color:#fff;padding:11px 18px;border-radius:999px;font-weight:600;font-size:14px;transition:all .25s;pointer-events:none;max-width:calc(100% - 32px);display:flex;gap:8px;align-items:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.screen{animation:fade .22s ease}
@keyframes fade{from{opacity:.4;transform:translateY(4px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* Page basics (safe areas, hidden) */
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
</style>

/* Split maths. All amounts are whole paise, so totals always add up exactly. */
function shares(e) {
  const out = {};
  if (e.split.type === "custom") { for (const [k, v] of Object.entries(e.split.custom || {})) if (v > 0) out[k] = v; return out; }
  const ps = (e.split.type === "equal" ? e.split.participants : e.split.participants).filter(id => mem(id));
  const n = ps.length; if (!n || !(e.amount > 0)) return out;
  const base = Math.floor(e.amount / n); let rem = e.amount - base * n;
  ps.forEach(id => { out[id] = base + (rem > 0 ? 1 : 0); if (rem > 0) rem--; });
  return out;
}
function balances() {
  const net = {}; S.members.forEach(m => net[m.id] = 0);
  for (const e of S.expenses) { net[e.paidBy] = (net[e.paidBy] || 0) + e.amount; for (const [k, v] of Object.entries(shares(e))) net[k] = (net[k] || 0) - v; }
  for (const s of S.settlements) { net[s.from] = (net[s.from] || 0) + s.amount; net[s.to] = (net[s.to] || 0) - s.amount; }
  return net;
}
function suggest(net) {
  const deb = [], cre = [];
  for (const [id, v] of Object.entries(net)) { if (v < 0) deb.push({ id, a: -v }); else if (v > 0) cre.push({ id, a: v }); }
  deb.sort((x, y) => y.a - x.a); cre.sort((x, y) => y.a - x.a);
  const out = []; let i = 0, j = 0;
  while (i < deb.length && j < cre.length) {
    const a = Math.min(deb[i].a, cre[j].a);
    if (a > 0) out.push({ from: deb[i].id, to: cre[j].id, amount: a });
    deb[i].a -= a; cre[j].a -= a;
    if (deb[i].a === 0) i++; if (cre[j].a === 0) j++;
  }
  return out;
}

/* ============ TASKS ============ */
function vTasks() {
  const total = S.tasks.length, done = S.tasks.filter(t => t.done).length;
  const pct = total ? Math.round(done / total * 100) : 0;
  const f = UI.taskF;
  const list = S.tasks.filter(t => f === "all" || (f === "assigned" && t.assignee === S.me) || (f === "mine" && t.createdBy === S.me));
  const open = list.filter(t => !t.done).sort((a, b) => (b.priority === "high") - (a.priority === "high") || (a.due || "9").localeCompare(b.due || "9"));
  const fin = list.filter(t => t.done);
  return `<header class="topbar"><h1>Tasks</h1><button class="iconbtn solid" data-a="addTask" aria-label="Add task">${ic("plus", 20, 2.4)}</button></header>
  <div class="card progress">${ill("luggage", 60)}
    <div style="flex:1;min-width:0"><b style="font-family:var(--font-d);font-size:18px;color:var(--teal)">${done} of ${total} done</b>
    <div class="muted" style="font-size:13px;font-weight:600">${total === 0 ? "Add the first job for the group" : pct === 100 ? "Everything's sorted. Pack your bags." : `${total - done} left before the trip`}</div>
    <div class="bar" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><i style="width:${pct}%"></i></div></div></div>
  <div class="seg" style="margin-top:14px">${[["all","All"],["assigned","Assigned to me"],["mine","I added"]].map(([k, l]) => `<button class="${f === k ? "on" : ""}" data-a="taskF" data-v="${k}">${l}</button>`).join("")}</div>
  <div class="section" style="margin-top:14px">
    ${open.length ? `<div class="card list">${open.map(taskRow).join("")}</div>`
      : list.length ? `<div class="note">${ic("check", 18)}<span>Nothing open here.</span></div>`
      : emptyState("luggage", f === "all" ? "No tasks yet" : "Nothing here", f === "all" ? "Start with the big ones: booking the stay and sorting transport." : "Tasks you're assigned or add will show up here.", "addTask", "Add a task")}
  </div>
  ${fin.length ? `<div class="section"><div class="sec-h"><h2>Done</h2><span class="votes-n">${fin.length}</span></div><div class="card list">${fin.map(taskRow).join("")}</div></div>` : ""}
  <div class="row" style="margin-top:18px;justify-content:center"><button class="btn" data-a="addTask">${ic("plus", 18, 2.4)} Add task</button></div>`;
}
function taskRow(t) {
  const late = !t.done && t.due && t.due < todayISO();
  return `<div class="task ${t.done ? "done" : ""}">
    <button class="chk ${t.done ? "on" : ""}" data-a="toggleTask" data-id="${t.id}" aria-label="${t.done ? "Mark not done" : "Mark done"}: ${esc(t.title)}" aria-pressed="${t.done}">${ic("check", 16, 3)}</button>
    <button class="t" data-a="editTask" data-id="${t.id}"><b>${esc(t.title)}</b>${t.notes ? `<div class="desc">${esc(t.notes)}</div>` : ""}
      <div class="foot">${t.assignee ? `<span class="row" style="gap:6px">${av(t.assignee, 20)}${esc(nm(t.assignee))}</span>` : "<span>Unassigned</span>"}
      ${t.due ? `<span class="due ${late ? "late" : ""}">${ic("cal", 14)}${late ? "Overdue · " : ""}${fmtDate(t.due)}</span>` : ""}
      ${t.priority === "high" && !t.done ? `<span class="pillt p-high">${ic("flag", 12, 2.4)}Priority</span>` : ""}</div></button>
    <span class="muted">${ic("chev", 18)}</span></div>`;
}

/* ============ MONEY ============ */
function vMoney() {
  const seg = `<div class="seg">${[["exp","Expenses"],["bal","Balances & settle"]].map(([k, l]) => `<button class="${UI.money === k ? "on" : ""}" data-a="moneySeg" data-v="${k}">${l}</button>`).join("")}</div>`;
  return `<header class="topbar"><h1>Money</h1><button class="iconbtn" data-a="shareMoney" aria-label="Share summary">${ic("share", 19)}</button><button class="iconbtn solid" data-a="addExpense" aria-label="Add expense">${ic("plus", 20, 2.4)}</button></header>
  ${seg}<div style="margin-top:16px">${UI.money === "exp" ? vExpenses() : vBalances()}</div>`;
}
function vExpenses() {
  const total = S.expenses.reduce((a, e) => a + e.amount, 0);
  const paid = S.expenses.filter(e => e.paidBy === S.me).reduce((a, e) => a + e.amount, 0);
  const myShare = S.expenses.reduce((a, e) => a + (shares(e)[S.me] || 0), 0);
  const net = balances()[S.me] || 0;
  const f = UI.expF;
  const list = S.expenses.filter(e => f === "all" || (f === "paid" && e.paidBy === S.me) || (f === "in" && shares(e)[S.me])).sort((a, b) => b.date.localeCompare(a.date));
  return `<div class="total">
    <svg class="wallet" viewBox="0 0 64 64" aria-hidden="true">${ART.wallet}</svg>
    <div class="lbl">Total trip spend</div><div class="big num">${money(total)}</div>
    <div class="lbl" style="margin-top:2px">${S.expenses.length} expense${S.expenses.length === 1 ? "" : "s"} · each one split its own way</div>
    <div class="mini3 num"><div><small>You paid</small><b>${money(paid)}</b></div><div><small>Your share</small><b>${money(myShare)}</b></div>
      <div><small>${net >= 0 ? "You get back" : "You owe"}</small><b>${money(Math.abs(net))}</b></div></div>
  </div>
  <div class="chips" style="margin-top:14px">${[["all","All"],["paid","Paid by me"],["in","Includes me"]].map(([k, l]) => `<button class="chip ${f === k ? "on" : ""}" data-a="expF" data-v="${k}">${l}</button>`).join("")}</div>
  <div class="section" style="margin-top:12px">
    ${list.length ? `<div class="card list">${list.map(e => { const mine = shares(e)[S.me] || 0; return `
      <button class="exp" data-a="viewExpense" data-id="${e.id}">${ill(e.category, 50)}
        <span class="t"><b>${esc(e.title)}</b><small>${CAT[e.category]} · ${fmtDate(e.date)}</small><small>Paid by ${esc(nm(e.paidBy))}</small></span>
        <span class="amt num">${money(e.amount)}<small class="muted">${mine ? "you " + money(mine) : "not in"}</small></span></button>`; }).join("")}</div>`
    : emptyState("wallet", "No expenses here", "Add the first bill. You choose who shares it each time.", "addExpense", "Add expense")}
  </div>
  <div class="two" style="margin-top:18px"><button class="btn ghost" data-a="scanReceipt">${ic("camera", 18)} Scan receipt</button><button class="btn" data-a="addExpense">${ic("plus", 18, 2.4)} Add expense</button></div>`;
}
function vBalances() {
  const net = balances(); const xs = suggest(net);
  const rows = S.members.map(m => ({ id: m.id, v: net[m.id] || 0 })).sort((a, b) => b.v - a.v);
  return `<div class="note">${ic("info", 18)}<span>Balances = what each person paid, minus their share of every expense, adjusted for payments already recorded. Let's Go doesn't move money. Pay in your UPI app, then record it here.</span></div>
  <div class="section"><div class="sec-h"><h2>Suggested payments</h2><span class="votes-n">${xs.length}</span></div>
    ${xs.length ? xs.map(x => { const to = mem(x.to); return `<div class="card xfer">
      <div class="who">${av(x.from, 34)}<span>${esc(nm(x.from))}</span>${ic("arrow", 18)}${av(x.to, 34)}<span>${esc(nm(x.to))}</span><span class="amt num">${money(x.amount)}</span></div>
      <div class="acts">
        ${to?.upi ? `<a class="btn sm" href="${esc(upiLink(to, x.amount))}">${ic("money", 16)} Pay via UPI</a><button class="btn sm ghost" data-a="copyUpi" data-id="${to.id}">${ic("copy", 16)} Copy UPI ID</button>`
          : `<button class="btn sm ghost" data-a="editMember" data-id="${x.to}">${ic("plus", 16, 2.4)} Add ${esc(nmFull(x.to))}'s UPI ID</button>`}
        <button class="btn sm soft" data-a="recordPay" data-from="${x.from}" data-to="${x.to}" data-amt="${x.amount}">${ic("check", 16, 2.4)} Mark as paid</button>
      </div></div>`; }).join("")
    : `<div class="card empty">${ill("wallet", 64)}<b>Everyone's square</b><p>No one owes anything right now.</p></div>`}
  </div>
  <div class="section"><div class="sec-h"><h2>Where everyone stands</h2></div>
    <div class="card list">${rows.map(r => `<div class="bal">${av(r.id, 36)}<span class="t"><b>${esc(nm(r.id))}</b><div class="muted" style="font-size:12.5px;font-weight:600">${r.v > 0 ? "gets back" : r.v < 0 ? (r.id === S.me ? "owe" : "owes") : "settled up"}</div></span><span class="v num ${r.v > 0 ? "pos" : r.v < 0 ? "neg" : ""}">${r.v === 0 ? "₹0" : (r.v > 0 ? "+" : "−") + money(Math.abs(r.v))}</span></div>`).join("")}</div>
  </div>
  <div class="section"><div class="sec-h"><h2>Payment history</h2></div>
    ${S.settlements.length ? `<div class="card list">${[...S.settlements].sort((a, b) => b.date.localeCompare(a.date)).map(s => `<div class="bal">${av(s.from, 32)}<span class="t"><b style="font-size:14.5px">${esc(nm(s.from))} paid ${esc(nm(s.to))}</b><div class="muted" style="font-size:12.5px;font-weight:600">${fmtDate(s.date)} · ${esc(s.method)}${s.note ? " · " + esc(s.note) : ""}</div></span><span class="num" style="font-weight:700">${money(s.amount)}</span><button class="iconbtn" data-a="delSettle" data-id="${s.id}" aria-label="Remove this record">${ic("trash", 16)}</button></div>`).join("")}</div>`
    : `<div class="note warm">${ic("info", 18)}<span>No payments recorded yet.</span></div>`}
  </div>
  <div class="section"><button class="btn block ghost" data-a="shareMoney">${ic("share", 18)} Share settlement summary</button></div>`;
}
function upiLink(m, paise) {
  const p = new URLSearchParams({ pa: m.upi, pn: m.name, am: (paise / 100).toFixed(2), cu: "INR", tn: "Let's Go: " + S.trip.name });
  return "upi://pay?" + p.toString();
}

/* ============ CHAT ============ */
function vChat() {
  return `<header class="topbar"><h1>Chat</h1>${avs(S.members.map(m => m.id), 30, 4)}</header>
  <button class="card tripbar" data-a="tab" data-v="trip">${ill("adventure", 40, 12)}<span style="flex:1;min-width:0"><b>${esc(S.trip.name)}</b><small>${tripRange()} · ${S.members.length} people</small></span><span class="link-btn">Trip ${ic("chev", 14)}</span></button>
  <div class="note warm" style="margin-top:10px">${ic("info", 18)}<span>Messages are saved on this phone only, until group sync is added. To reach everyone now, use Share to WhatsApp.</span></div>
  <div class="msgs" style="margin-top:12px">${S.messages.length ? S.messages.map(msgHTML).join("") : `<div class="empty"><b>Say hi to the group</b><p>Share an idea, a task or an expense with the + button.</p></div>`}</div>`;
}
function linkify(t) {
  return esc(t).replace(/(https?:\/\/[^\s<]+)/g, u => `<a href="${u}" target="_blank" rel="noopener">${u.length > 38 ? u.slice(0, 36) + "…" : u}</a>`);
}
function refCard(kind, id) {
  if (kind === "idea") { const i = S.ideas.find(x => x.id === id); if (!i) return `<div class="refcard"><small>This idea was removed</small></div>`;
    return `<button class="refcard" data-a="editIdea" data-id="${i.id}">${ill(i.category, 40, 12)}<span><b>${esc(i.title)}</b><small>${i.status === "confirmed" ? "On the plan" : i.status === "shortlisted" ? "Shortlisted" : "Proposed"} · ${i.votes.length} votes</small></span></button>`; }
  if (kind === "task") { const t = S.tasks.find(x => x.id === id); if (!t) return `<div class="refcard"><small>This task was removed</small></div>`;
    return `<button class="refcard" data-a="editTask" data-id="${t.id}">${ill("luggage", 40, 12)}<span><b>${esc(t.title)}</b><small>${t.done ? "Done" : "Open"} · ${esc(nm(t.assignee))}</small></span></button>`; }
  if (kind === "expense") { const e = S.expenses.find(x => x.id === id); if (!e) return `<div class="refcard"><small>This expense was removed</small></div>`;
    return `<button class="refcard" data-a="viewExpense" data-id="${e.id}">${ill(e.category, 40, 12)}<span><b>${esc(e.title)} · ${money(e.amount)}</b><small>Paid by ${esc(nm(e.paidBy))}</small></span></button>`; }
  return "";
}
function msgHTML(m) {
  const me = m.from === S.me;
  const url = (m.text || "").match(/https?:\/\/[^\s]+/);
  return `<div class="msg ${me ? "me" : ""}">${me ? "" : av(m.from, 30)}<div class="bub">
    ${me ? "" : `<div class="nm" style="color:${mem(m.from)?.color || "inherit"}">${esc(nmFull(m.from))}</div>`}
    ${m.text ? `<div>${linkify(m.text)}</div>` : ""}
    ${url ? `<a class="refcard" href="${esc(url[0])}" target="_blank" rel="noopener" style="text-decoration:none">${ill("link", 40, 12)}<span><b>${esc(domainOf(url[0]))}</b><small>Open link</small></span></a>` : ""}
    ${m.kind !== "text" ? refCard(m.kind, m.ref) : ""}
    <div class="ts">${clockOf(m.ts)}</div></div></div>`;
}
function composer() {
  return `<div class="composer"><form id="chatForm" autocomplete="off">
    <button type="button" class="iconbtn" data-a="attach" aria-label="Share an idea, task or expense">${ic("plus", 20, 2.3)}</button>
    <input id="chatIn" placeholder="Message the group" aria-label="Message" maxlength="1000">
    <button type="submit" class="iconbtn solid" aria-label="Send">${ic("send", 18, 2.2)}</button></form></div>`;
}
function postMsg(m) { S.messages.push(Object.assign({ id: uid("c"), from: S.me, ts: Date.now(), kind: "text", text: "" }, m)); }

/* ============ Sheets: forms ============ */
function pickRowMembers(group, sel, opts = {}) {
  return `<div class="pickrow" data-group="${group}">${(opts.none ? [""] : []).concat(S.members.map(m => m.id)).map(id => `<button type="button" class="pk ${sel === id ? "on" : ""}" data-a="pick" data-g="${group}" data-v="${id}">${id ? av(id, 40) : `<span class="av" style="width:40px;height:40px;background:var(--cream);color:var(--muted)">–</span>`}${id ? esc(nm(id)) : "Nobody"}</button>`).join("")}</div>`;
}
function pickRowCats(group, cats, sel) {
  return `<div class="pickrow" data-group="${group}">${cats.map(c => `<button type="button" class="pk ${sel === c ? "on" : ""}" data-a="pick" data-g="${group}" data-v="${c}">${ill(c, 46, 14)}${CAT[c].replace(" experience", "")}</button>`).join("")}</div>`;
}

/* Idea / activity */
function openIdea(id, preset = {}) {
  const i = id ? S.ideas.find(x => x.id === id) : null;
  F = i ? clone(i) : Object.assign({ id: null, title: "", category: "adventure", desc: "", location: "", link: "", status: "proposed", day: UI.day, time: "10:00", votes: [S.me], createdBy: S.me }, preset);
  if (F.day == null) F.day = UI.day;
  const dl = days();
  openSheet(i ? (i.status === "confirmed" ? "Activity" : "Idea") : (preset.status === "confirmed" ? "Add activity" : "Suggest an idea"), `
  <form class="stack" id="ideaForm">
    <div class="field"><label for="f-title">Name</label><input class="inp" id="f-title" value="${esc(F.title)}" placeholder="e.g. Abbey Falls walk" maxlength="80"></div>
    <div class="field"><span class="flabel">Category</span>${pickRowCats("category", IDEA_CATS, F.category)}</div>
    <div class="field"><label for="f-desc">Notes</label><input class="inp" id="f-desc" value="${esc(F.desc)}" placeholder="Why it's worth it" maxlength="140"></div>
    <div class="two"><div class="field"><label for="f-loc">Location</label><input class="inp" id="f-loc" value="${esc(F.location)}" placeholder="Place or area"></div>
    <div class="field"><label for="f-link">Link</label><input class="inp" id="f-link" value="${esc(F.link)}" placeholder="https://" inputmode="url"></div></div>
    <div class="field"><span class="flabel">Status</span><div class="seg" data-group="status">${[["proposed","Proposed"],["shortlisted","Shortlisted"],["confirmed","On the plan"]].map(([k, l]) => `<button type="button" class="${F.status === k ? "on" : ""}" data-a="pick" data-g="status" data-v="${k}">${l}</button>`).join("")}</div></div>
    <div class="two" id="schedBox" ${F.status === "confirmed" ? "" : "hidden"}>
      <div class="field"><label for="f-day">Day</label><select class="inp" id="f-day">${dl.map((d, k) => `<option value="${k}" ${F.day === k ? "selected" : ""}>Day ${k + 1} · ${fmtDate(d)}</option>`).join("")}</select></div>
      <div class="field"><label for="f-time">Time</label><input class="inp" type="time" id="f-time" value="${esc(F.time || "10:00")}"></div></div>
    ${i ? `<div class="note">${ic("vote", 18)}<span>${i.votes.length ? `Votes from ${i.votes.map(nm).map(esc).join(", ")}` : "No votes yet"}. Suggested by ${esc(nm(i.createdBy))}.</span></div>` : ""}
    <div class="err" id="f-err" hidden></div>
    <button class="btn block" type="submit">${i ? "Save changes" : F.status === "confirmed" ? "Add to day" : "Post idea"}</button>
    ${i ? `<div class="two"><button type="button" class="btn ghost" data-a="shareRef" data-k="idea" data-id="${i.id}">${ic("chat", 17)} Share in chat</button><button type="button" class="btn danger" data-a="delIdea" data-id="${i.id}">${ic("trash", 17)} Delete</button></div>` : ""}
  </form>`, () => {
    $("#ideaForm").addEventListener("submit", ev => {
      ev.preventDefault();
      const title = $("#f-title").value.trim(); const link = $("#f-link").value.trim();
      if (!title) return formErr("Give it a name so people know what they're voting on.", "#f-title");
      if (link && !/^https?:\/\/\S+\.\S+/.test(link)) return formErr("Links need to start with http:// or https://", "#f-link");
      Object.assign(F, { title, desc: $("#f-desc").value.trim(), location: $("#f-loc").value.trim(), link });
      if (F.status === "confirmed") { F.day = +$("#f-day").value; F.time = $("#f-time").value; } else { F.day = null; F.time = ""; }
      if (F.id) { const k = S.ideas.findIndex(x => x.id === F.id); S.ideas[k] = clone(F); toast("Saved"); }
      else { F.id = uid("i"); S.ideas.push(clone(F)); toast(F.status === "confirmed" ? `Added to Day ${F.day + 1}` : "Idea posted. Votes welcome."); }
      if (F.status === "confirmed") UI.day = F.day;
      closeSheet(); render();
    });
  });
}
function formErr(msg, sel) { const e = $("#f-err"); e.textContent = msg; e.hidden = false; if (sel) { const el = $(sel); el.classList.add("bad"); el.focus(); el.addEventListener("input", () => el.classList.remove("bad"), { once: true }); } }

  </form>`, () => {

function draftAmount() { const v = toPaise($("#f-amt")?.value || ""); return isNaN(v) ? 0 : v; }
function renderSplitBox() {

function updateSplitStatus() {
  const st = $("#splitStatus"); if (!st) return;
  const amt = draftAmount(); const t = F.split.type;
  if (t === "custom") {
    const sum = Object.values(F.split.custom).reduce((a, b) => a + (b || 0), 0);
    const diff = amt - sum;
    st.innerHTML = !amt ? `<div class="status bad">Enter the total amount first.</div>`
      : diff === 0 ? `<div class="status ok">${ic("check", 14, 3).replace('class="ic"', 'class="ic" style="display:inline;vertical-align:-2px"')} Adds up to ${money(amt)} exactly.</div>`
      : `<div class="status bad">${diff > 0 ? `${money(diff)} still to assign` : `${money(-diff)} too much`} (assigned ${money(sum)} of ${money(amt)})</div>`;
  } else {
    const n = F.split.participants.length;
    if (t === "equal" || t === "participation") {
      const sh = shares(Object.assign({}, F, { amount: amt }));
      document.querySelectorAll("#splitBox .prow").forEach((row, k) => { const id = S.members[k]?.id; const el = row.querySelector(".sh"); if (el) el.textContent = F.split.participants.includes(id) ? money(sh[id] || 0) : "–"; });

  }

function saveExpense() {
  const title = $("#f-title").value.trim(); const amount = toPaise($("#f-amt").value);
  if (!title) return formErr("Add a short description, like \"Dinner\" or \"Fuel\".", "#f-title");
  if (isNaN(amount) || amount <= 0) return formErr("Enter an amount above ₹0.", "#f-amt");
  if (amount > 100000000) return formErr("That amount looks too large. Check the number.", "#f-amt");
  if (!$("#f-date").value) return formErr("Pick the date of the expense.", "#f-date");
  if (F.split.type !== "custom" && !F.split.participants.length) return formErr("Pick at least one person to share this.");
  if (F.split.type === "custom") {
    const sum = Object.values(F.split.custom).reduce((a, b) => a + (b || 0), 0);
    if (sum !== amount) return formErr(`Custom amounts add up to ${money(sum)}, but the expense is ${money(amount)}.`);
    F.split.participants = Object.keys(F.split.custom).filter(k => F.split.custom[k] > 0);
  } else F.split.custom = {};
  const rec = { id: F.id || uid("e"), title, amount, date: $("#f-date").value, paidBy: F.paidBy, category: F.category, note: $("#f-note").value.trim(), split: clone(F.split) };
  if (F.id) { S.expenses[S.expenses.findIndex(x => x.id === F.id)] = rec; toast("Expense updated. Balances recalculated."); }
  else { S.expenses.push(rec); toast(`${money(amount)} added to the ledger`); }
  UI.tab = "money"; UI.money = "exp"; closeSheet(); render();
}

  addActivity: () => { closeIfOpen(); openIdea(null, { status: "confirmed", day: UI.day, time: "10:00" }); },
  editIdea: d => { closeIfOpen(); openIdea(d.id); },
  delIdea: (d, el) => { if (!confirmTap(el, "Tap again to delete")) return; S.ideas = S.ideas.filter(x => x.id !== d.id); closeSheet(); render(); toast("Deleted"); },
  addLink: () => openLink(null), linkMenu: d => openLink(d.id),
  delLink: (d, el) => { if (!confirmTap(el, "Tap again to delete")) return; S.links = S.links.filter(x => x.id !== d.id); closeSheet(); render(); toast("Link removed"); },
  shareLink: d => { const l = S.links.find(x => x.id === d.id); shareSheet("Share link", `${l.title}\n${l.url}${l.note ? "\n" + l.note : ""}\n\nFrom our ${S.trip.name} plan on Let's Go`); },
  addTask: () => { closeIfOpen(); openTask(null); }, editTask: d => { closeIfOpen(); openTask(d.id); },
  toggleTask: (d, el) => { const t = S.tasks.find(x => x.id === d.id); t.done = !t.done; el.classList.add("pop"); setTimeout(render, 220); toast(t.done ? "Done. Nice work." : "Marked as not done", t.done ? "check" : "x"); },
  delTask: (d, el) => { if (!confirmTap(el, "Tap again to delete")) return; S.tasks = S.tasks.filter(x => x.id !== d.id); closeSheet(); render(); toast("Task deleted"); },
  addExpense: () => { closeIfOpen(); openExpense(null, "manual"); }, scanReceipt: () => { closeIfOpen(); openExpense(null, "scan"); },
  editExpense: d => { closeIfOpen(); openExpense(d.id); }, viewExpense: d => { closeIfOpen(); viewExpense(d.id); },
  delExpense: (d, el) => { if (!confirmTap(el, "Tap again to delete")) return; S.expenses = S.expenses.filter(x => x.id !== d.id); closeSheet(); render(); toast("Expense deleted. Balances recalculated."); },
  expMode: (d, el) => { F.mode = d.v; el.parentElement.querySelectorAll("button").forEach(b => b.classList.toggle("on", b === el)); $("#scanBox").hidden = d.v !== "scan"; },
  expSplit: (d, el) => { if (F.split.type === "custom" && d.v !== "custom") F.split.participants = S.members.map(m => m.id);
    if (d.v === "custom" && !Object.keys(F.split.custom).length) { const sh = shares(Object.assign({}, F, { amount: draftAmount(), split: Object.assign({}, F.split, { type: "participation" }) })); F.split.custom = sh; }
    F.split.type = d.v; el.parentElement.querySelectorAll(".opt").forEach(b => b.classList.toggle("on", b === el)); renderSplitBox(); },
  expPart: d => { const p = F.split.participants; const k = p.indexOf(d.id); if (k >= 0) p.splice(k, 1); else p.push(d.id); F.split.participants = S.members.map(m => m.id).filter(id => p.includes(id)); renderSplitBox(); },
  pick: (d, el) => { F[d.g] = d.v; const box = el.closest("[data-group]"); box.querySelectorAll("[data-a=pick]").forEach(b => b.classList.toggle("on", b === el)); if (d.g === "status") $("#schedBox").hidden = d.v !== "confirmed"; },
  recordPay: d => recordPay(d.from, d.to, +d.amt),
  delSettle: (d, el) => { if (!confirmTap(el, "Sure?")) return; S.settlements = S.settlements.filter(x => x.id !== d.id); render(); toast("Payment record removed"); },
  copyUpi: d => copyText(mem(d.id).upi, "UPI ID copied"),
  editMember: d => { closeIfOpen(); editMember(d.id || null); },
  delMember: (d, el) => {
    const used = S.expenses.some(e => e.paidBy === d.id || shares(e)[d.id]) || S.settlements.some(s => s.from === d.id || s.to === d.id);
    if (used) { formErr(`${nmFull(d.id)} is part of some expenses. Edit or remove those first so the maths stays right.`); return; }
    if (!confirmTap(el, "Tap again to remove")) return;
    S.members = S.members.filter(m => m.id !== d.id);
    S.tasks.forEach(t => { if (t.assignee === d.id) t.assignee = ""; }); S.ideas.forEach(i => i.votes = i.votes.filter(v => v !== d.id));
    closeSheet(); render(); toast("Removed from trip"); },
  tripSettings: () => { closeIfOpen(); tripSettings(); },
  invite: () => shareSheet("Invite friends", `Join me on our trip "${S.trip.name}"${S.trip.destination ? " to " + S.trip.destination : ""}, ${tripRange()}!\n\nWe're planning it on Let's Go: ideas to vote on, tasks and a shared expense split.\n\nFor now I'll add you to the trip myself. Shared trip links are coming soon.`),
  shareTrip: () => shareSheet("Share trip summary", tripSummary()),
  shareDay: () => shareSheet(UI.plan === "itin" ? `Share Day ${UI.day + 1}` : "Share plan", UI.plan === "itin" ? dayText(UI.day) : tripSummary()),
  shareMoney: () => shareSheet("Share money summary", moneyText()),
  nativeShare: () => { const t = F.shareText || ""; navigator.share({ text: t }).then(() => toast("Shared")).catch(err => { if (err && err.name !== "AbortError") toast("Couldn't open sharing. Try Copy text.", "info"); }); },
  copyShare: () => copyText(F.shareText || $("#shareText")?.textContent || "", "Copied. Paste it in WhatsApp."),
  shareRef: d => { postMsg({ kind: d.k, ref: d.id }); closeSheet(); go("chat"); toast("Shared in chat"); },
  quickAdd: () => openSheet("Add to the trip", `<div class="qa">
    <button class="card" data-a="addIdea">${ill("adventure", 52)}<b>Idea</b><small>A place or plan to vote on</small></button>
    <button class="card" data-a="addTask">${ill("luggage", 52)}<b>Task</b><small>A job for someone</small></button>
    <button class="card" data-a="addExpense">${ill("wallet", 52)}<b>Expense</b><small>Something that was paid</small></button>
    <button class="card" data-a="scanReceipt">${ill("other", 52)}<b>Receipt</b><small>Photo, then check details</small></button></div>`),
  attach: () => openSheet("Share in chat", `<div class="stack">
    <div class="eyebrow">Ideas</div><div class="card list">${S.ideas.slice(0, 6).map(i => `<button class="exp" data-a="shareRef" data-k="idea" data-id="${i.id}">${ill(i.category, 40)}<span class="t"><b>${esc(i.title)}</b><small>${i.votes.length} votes</small></span>${ic("send", 16)}</button>`).join("") || `<p class="calc" style="padding:12px">No ideas yet</p>`}</div>
    <div class="eyebrow">Open tasks</div><div class="card list">${S.tasks.filter(t => !t.done).map(t => `<button class="exp" data-a="shareRef" data-k="task" data-id="${t.id}">${ill("luggage", 40)}<span class="t"><b>${esc(t.title)}</b><small>${esc(nm(t.assignee))}</small></span>${ic("send", 16)}</button>`).join("") || `<p class="calc" style="padding:12px">No open tasks</p>`}</div>
    <div class="eyebrow">Recent expenses</div><div class="card list">${[...S.expenses].sort((a, b) => b.date.localeCompare(a.date)).slice(0, 5).map(e => `<button class="exp" data-a="shareRef" data-k="expense" data-id="${e.id}">${ill(e.category, 40)}<span class="t"><b>${esc(e.title)}</b><small>${money(e.amount)}</small></span>${ic("send", 16)}</button>`).join("") || `<p class="calc" style="padding:12px">No expenses yet</p>`}</div></div>`),
  resetDemo: (d, el) => { if (!confirmTap(el, "Tap again: replaces this trip")) return; S = seed(); UI = Object.assign(UI, { tab: "trip", day: 0 }); closeSheet(); render(); toast("Demo trip restored"); },
  newTrip: (d, el) => { if (!confirmTap(el, "Tap again: clears everything")) return; S = blankTrip(S); UI = Object.assign(UI, { tab: "trip", day: 0 }); closeSheet(); render(); toast("Blank trip ready"); tripSettings(); }
};
function closeIfOpen() { if (!$("#sheet").hidden) { const sh = $("#sheet"); sh.classList.remove("show"); sh.hidden = true; $("#scrim").hidden = true; $("#scrim").classList.remove("show"); document.body.style.overflow = ""; } }
function copyText(t, ok) {
  const fallback = () => { const r = document.createRange(); const el = $("#shareText"); if (el) { r.selectNodeContents(el); const s = getSelection(); s.removeAllRanges(); s.addRange(r); toast("Text selected. Use Copy from the menu.", "info"); } else toast("Couldn't copy. Long-press to copy instead.", "info"); };
  try { navigator.clipboard.writeText(t).then(() => toast(ok), fallback); } catch { fallback(); }
}

document.addEventListener("click", ev => {
  const el = ev.target.closest("[data-a]"); if (!el) return;
  const fn = A[el.dataset.a]; if (!fn) return;
  ev.preventDefault(); fn(el.dataset, el);
});
document.addEventListener("input", ev => {
  const t = ev.target;
  if (t.id === "f-amt" && $("#expForm")) { if (F.split?.type === "custom") updateSplitStatus(); else { updateSplitStatus(); } }
  if (t.classList.contains("custom-in")) { const v = toPaise(t.value); F.split.custom[t.dataset.id] = isNaN(v) ? 0 : Math.max(0, v); updateSplitStatus(); }
});
document.addEventListener("submit", ev => {
  if (ev.target.id !== "chatForm") return;
  ev.preventDefault();
  const inp = $("#chatIn"); const text = inp.value.trim(); if (!text) return;
  postMsg({ text }); render(); setTimeout(() => $("#chatIn")?.focus(), 50);
});

render();
if ("serviceWorker" in navigator && location.protocol === "https:") {
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}
</script>
</body>
</html>
